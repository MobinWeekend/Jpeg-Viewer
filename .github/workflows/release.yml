name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 1. Validate once on both primary desktop platforms before any release build.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Verify locked Cargo metadata
        run: cargo metadata --locked --no-deps --format-version 1 > $null
        if: runner.os == 'Windows'

      - name: Verify locked Cargo metadata (Linux)
        if: runner.os != 'Windows'
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Validate package metadata
        run: python scripts/validate_packaging.py

      - name: Test release metadata helpers
        run: python -m unittest discover -s scripts/tests -v

      - name: Run tests
        run: cargo test --locked

  # ---------------------------------------------------------------------------
  # 2. Native Windows binaries and portable ZIPs.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package executable and portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:JPEG_VIEWER_VERSION
          $arch = '${{ matrix.arch }}'
          $dist = 'dist/windows'
          $portable = Join-Path $dist 'portable'
          New-Item -ItemType Directory -Force -Path $dist, $portable | Out-Null

          $binary = 'target\release\jpeg_viewer.exe'
          if (-not (Test-Path $binary)) {
            throw "Release binary was not produced: $binary"
          }

          $releaseExe = "JPEG-Viewer-Windows-$arch.exe"
          Copy-Item $binary (Join-Path $dist $releaseExe)
          Copy-Item $binary (Join-Path $portable 'jpeg_viewer.exe')
          Copy-Item 'README.md' (Join-Path $portable 'README.md')
          Copy-Item 'QUICK_START.md' (Join-Path $portable 'GETTING_STARTED.md')
          Copy-Item 'LICENSE' (Join-Path $portable 'LICENSE')
          Set-Content -Encoding utf8 (Join-Path $portable 'VERSION.txt') "JPEG Viewer $version`r`nArchitecture: $arch"

          Compress-Archive -Path (Join-Path $portable '*') `
            -DestinationPath (Join-Path $dist "JPEG-Viewer-Portable-$arch.zip") -CompressionLevel Optimal

          Get-ChildItem $dist | Format-Table Name, Length

      - name: Upload Windows ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/windows/JPEG-Viewer-Windows-${{ matrix.arch }}.exe
            dist/windows/JPEG-Viewer-Portable-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Build both installer architectures on one stable x64 Windows runner. Inno
  # Setup emits architecture-aware installers for native x64 and ARM64 Windows.
  package-windows-installers:
    name: Package Windows installers
    needs: build-windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Download x64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: installer-input/x64

      - name: Download ARM64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-ARM64
          path: installer-input/ARM64

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup --exact --source winget `
            --silent --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }

      - name: Compile per-user installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          New-Item -ItemType Directory -Force -Path 'dist\windows-installers' | Out-Null

          foreach ($arch in @('x64', 'ARM64')) {
            $binaryDir = (Resolve-Path (Join-Path 'installer-input' $arch)).Path
            $expected = Join-Path $binaryDir "JPEG-Viewer-Windows-$arch.exe"
            if (-not (Test-Path $expected)) {
              throw "Missing $arch installer input: $expected"
            }

            $env:JPEG_VIEWER_ARCH = $arch
            $env:JPEG_VIEWER_BINARY_DIR = $binaryDir
            & $iscc '/Qp' 'packaging\windows\installer.iss'
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed for $arch (exit $LASTEXITCODE)" }
          }

          Get-ChildItem 'dist\windows-installers' | Format-Table Name, Length

      - name: Upload Windows installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers
          path: dist/windows-installers/JPEG-Viewer-Setup-*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Linux portable archives, built natively against the Ubuntu 22.04 baseline.
  # ---------------------------------------------------------------------------
  build-linux-portable:
    name: Build Linux portable ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: ARM64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libdbus-1-dev libx11-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.rust_target }}"

      - name: Package portable archive
        shell: bash
        run: |
          set -euo pipefail
          ARCH='${{ matrix.arch }}'
          STAGE='stage/JPEG-Viewer'
          mkdir -p "$STAGE"
          install -Dm755 "target/${{ matrix.rust_target }}/release/jpeg_viewer" "$STAGE/jpeg_viewer"
          install -Dm644 README.md "$STAGE/README.md"
          install -Dm644 QUICK_START.md "$STAGE/GETTING_STARTED.md"
          install -Dm644 LICENSE "$STAGE/LICENSE"
          install -Dm644 assets/icons/icon.png "$STAGE/icon.png"
          install -Dm644 packaging/linux/com.jpegviewer.JpegViewer.desktop "$STAGE/com.jpegviewer.JpegViewer.desktop"
          install -Dm755 packaging/linux/install-portable.sh "$STAGE/install.sh"
          install -Dm755 packaging/linux/uninstall-portable.sh "$STAGE/uninstall.sh"
          install -Dm644 packaging/linux/jpeg-viewer-queue.xml "$STAGE/jpeg-viewer-queue.xml"
          printf 'JPEG Viewer %s\nArchitecture: %s\n' "$JPEG_VIEWER_VERSION" "$ARCH" > "$STAGE/VERSION.txt"
          tar -C stage -czf "JPEG-Viewer-Linux-${ARCH}.tar.gz" JPEG-Viewer

      - name: Upload Linux portable archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-portable-${{ matrix.arch }}
          path: JPEG-Viewer-Linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Debian packages.
  # ---------------------------------------------------------------------------
  build-debian:
    name: Build Debian ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: ARM64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config dpkg dpkg-dev libdbus-1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Each runner is native to its target architecture. Keep Cargo's default
      # target directory so cargo-deb assets at target/release resolve correctly.
      - name: Build
        run: cargo build --release --locked

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.8.0 --locked

      - name: Build and verify Debian package
        shell: bash
        run: |
          set -euo pipefail
          cargo deb --no-build --deb-version "$JPEG_VIEWER_DEB_VERSION"
          DEB="$(find target/debian -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB" || { echo 'cargo-deb did not produce a .deb'; exit 1; }
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | grep -E 'usr/bin/jpeg_viewer|usr/share/applications|usr/share/metainfo|usr/share/mime'
          dpkg-deb -f "$DEB" Version
          cp "$DEB" "JPEG-Viewer-Linux-${{ matrix.arch }}.deb"

      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-${{ matrix.arch }}
          path: JPEG-Viewer-Linux-${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 5. macOS app bundles, ZIPs, and drag-to-Applications DMGs.
  # Signing/notarization require Apple Developer ID secrets and are not enabled.
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Intel-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
          - arch: Apple-Silicon-ARM64
            runner: macos-15
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.rust_target }}"

      - name: Package app bundle, ZIP, and DMG
        shell: bash
        run: |
          set -euo pipefail
          APP='JPEG Viewer.app'
          BIN="target/${{ matrix.rust_target }}/release/jpeg_viewer"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" icon.iconset
          install -m755 "$BIN" "$APP/Contents/MacOS/jpeg_viewer"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          cp LICENSE README.md QUICK_START.md "$APP/Contents/Resources/"

          # Apple iconset filenames require both standard and @2x pixel sizes.
          sips -z 16 16 assets/icons/icon.png --out icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 assets/icons/icon.png --out icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 assets/icons/icon.png --out icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 assets/icons/icon.png --out icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 assets/icons/icon.png --out icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 assets/icons/icon.png --out icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 assets/icons/icon.png --out icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 assets/icons/icon.png --out icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 assets/icons/icon.png --out icon.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 assets/icons/icon.png --out icon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/jpeg_viewer.icns"

          ARCH='${{ matrix.arch }}'
          ditto -c -k --sequesterRsrc --keepParent "$APP" "JPEG-Viewer-macOS-${ARCH}.zip"
          mkdir -p dmg-root
          ditto "$APP" "dmg-root/$APP"
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname 'JPEG Viewer' -srcfolder dmg-root -ov -format UDZO "JPEG-Viewer-macOS-${ARCH}.dmg"

      - name: Upload macOS packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: |
            JPEG-Viewer-macOS-${{ matrix.arch }}.zip
            JPEG-Viewer-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 6. AppImage. Use a tagged linuxdeploy release, never the mutable continuous build.
  # ---------------------------------------------------------------------------
  build-appimage:
    name: Build AppImage ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            appimage_arch: x86_64
          - arch: ARM64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libdbus-1-dev libx11-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
            wget file libfuse2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.rust_target }}"

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/512x512/apps \
            AppDir/usr/share/mime/packages
          install -m755 "target/${{ matrix.rust_target }}/release/jpeg_viewer" AppDir/usr/bin/jpeg_viewer
          install -m644 packaging/linux/com.jpegviewer.JpegViewer.desktop AppDir/usr/share/applications/com.jpegviewer.JpegViewer.desktop
          install -m644 packaging/icons/512x512/com.jpegviewer.JpegViewer.png AppDir/usr/share/icons/hicolor/512x512/apps/com.jpegviewer.JpegViewer.png
          install -m644 packaging/linux/jpeg-viewer-queue.xml AppDir/usr/share/mime/packages/jpeg-viewer-queue.xml
          install -m644 LICENSE AppDir/LICENSE
          cp packaging/linux/com.jpegviewer.JpegViewer.desktop AppDir/com.jpegviewer.JpegViewer.desktop
          cp packaging/icons/512x512/com.jpegviewer.JpegViewer.png AppDir/jpeg_viewer.png
          cat > AppDir/AppRun <<'APP_RUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/jpeg_viewer" "$@"
          APP_RUN
          chmod +x AppDir/AppRun

          LINUXDEPLOY_VERSION='1-alpha-20251107-1'
          curl -fL --retry 3 \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-${{ matrix.appimage_arch }}.AppImage" \
            -o linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH='${{ matrix.appimage_arch }}' \
            ./linuxdeploy.AppImage --appdir AppDir \
              --desktop-file AppDir/com.jpegviewer.JpegViewer.desktop \
              --icon-file AppDir/jpeg_viewer.png --output appimage

          APPIMAGE_FILE="$(find . -maxdepth 1 -type f -iname '*.appimage' ! -name 'linuxdeploy.AppImage' -print -quit)"
          test -n "$APPIMAGE_FILE" || { echo 'linuxdeploy produced no AppImage'; exit 1; }
          mv "$APPIMAGE_FILE" "JPEG-Viewer-Linux-${{ matrix.arch }}.AppImage"
          file "JPEG-Viewer-Linux-${{ matrix.arch }}.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ matrix.arch }}
          path: JPEG-Viewer-Linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 7. Fedora-compatible RPMs built with FPM; the unused generated spec is gone.
  # ---------------------------------------------------------------------------
  build-rpm:
    name: Build Fedora RPM ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            rpm_arch: x86_64
          - arch: ARM64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install RPM build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config rpm ruby ruby-dev libdbus-1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.rust_target }}"

      - name: Install pinned FPM
        run: sudo gem install fpm --version 1.18.0 --no-document

      - name: Stage and build RPM
        shell: bash
        run: |
          set -euo pipefail
          STAGE='rpm-stage'
          install -Dm755 "target/${{ matrix.rust_target }}/release/jpeg_viewer" "$STAGE/usr/bin/jpeg_viewer"
          install -Dm644 packaging/linux/com.jpegviewer.JpegViewer.desktop "$STAGE/usr/share/applications/com.jpegviewer.JpegViewer.desktop"
          install -Dm644 packaging/linux/com.jpegviewer.JpegViewer.metainfo.xml "$STAGE/usr/share/metainfo/com.jpegviewer.JpegViewer.metainfo.xml"
          install -Dm644 packaging/icons/512x512/com.jpegviewer.JpegViewer.png "$STAGE/usr/share/icons/hicolor/512x512/apps/com.jpegviewer.JpegViewer.png"
          install -Dm644 packaging/linux/jpeg-viewer-queue.xml "$STAGE/usr/share/mime/packages/jpeg-viewer-queue.xml"
          install -Dm644 LICENSE "$STAGE/usr/share/licenses/jpeg-viewer/LICENSE"

          fpm -s dir -t rpm -n jpeg-viewer \
            --version "$JPEG_VIEWER_RPM_VERSION" \
            --architecture '${{ matrix.rpm_arch }}' \
            --license 'GPL-3.0-only' \
            --vendor 'MobinWeekend' \
            --maintainer 'MobinWeekend' \
            --url 'https://github.com/MobinWeekend/Jpeg-Viewer' \
            --description 'Fast, lightweight GPU-accelerated image viewer' \
            --depends glibc --depends libgcc --depends libstdc++ \
            --depends libX11 --depends libxkbcommon --depends wayland-libs-client \
            --depends mesa-libEGL --depends mesa-libGL --depends dbus-libs --depends libzstd \
            --after-install packaging/fedora/post-install.sh \
            --after-remove packaging/fedora/post-remove.sh \
            -C "$STAGE" .

          RPM_FILE="$(find . -maxdepth 1 -type f -name 'jpeg-viewer-*.rpm' -print -quit)"
          test -n "$RPM_FILE" || { echo 'FPM did not produce an RPM'; exit 1; }
          rpm -qp --info "$RPM_FILE"
          rpm -qp --requires "$RPM_FILE"
          rpm -qp --list "$RPM_FILE" | grep -E '/usr/bin/jpeg_viewer|\.desktop$|metainfo|mime/packages|LICENSE'
          cp "$RPM_FILE" "JPEG-Viewer-Fedora-${{ matrix.arch }}.rpm"

      - name: Upload Fedora RPM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-${{ matrix.arch }}
          path: JPEG-Viewer-Fedora-${{ matrix.arch }}.rpm
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 8. Arch packages. Normalize package extension to .pkg.tar.zst on both arches.
  # ---------------------------------------------------------------------------
  build-arch:
    name: Build Arch Linux ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            image: archlinux:latest
          - arch: ARM64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:base-devel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Build package inside native Arch container
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ env.JPEG_VIEWER_VERSION }}'
          ARCH_VERSION='${{ env.JPEG_VIEWER_ARCH_VERSION }}'
          IMAGE='${{ matrix.image }}'
          CONTAINER_NAME="jpeg-viewer-arch-${{ matrix.arch }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # Write package output directly to the runner through a dedicated bind
          # mount. This avoids docker cp against a stopped container, where the
          # output directory has proven unreliable across the x64/ARM image variants.
          rm -rf out
          mkdir -p out
          chmod 0777 out
          cleanup_arch_container() {
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup_arch_container EXIT

          docker run --name "$CONTAINER_NAME" --user 0:0 \
            -e GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            -e VERSION="$VERSION" \
            -e ARCH_VERSION="$ARCH_VERSION" \
            -v "$PWD:/src" \
            -v "$PWD/out:/arch-output" \
            -w /src "$IMAGE" bash -s <<'ARCH_SCRIPT'
          set -euo pipefail
          if [ "$(uname -m)" = "aarch64" ]; then
            pacman-key --init
            pacman-key --populate archlinuxarm || true
            grep -q "^[[:space:]]*DisableSandbox" /etc/pacman.conf || sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
          fi
          pacman -Syu --noconfirm --needed base-devel rust cargo pkgconf dbus libx11 libxkbcommon wayland mesa git zstd unrar python
          printf '\nPKGEXT=".pkg.tar.zst"\nPKGDEST="/arch-output"\n' >> /etc/makepkg.conf
          getent passwd nobody >/dev/null || { echo "The Arch container has no nobody account"; exit 1; }
          mkdir -p /tmp/arch-build /tmp/arch-home /arch-output
          cp packaging/arch/PKGBUILD /tmp/arch-build/PKGBUILD
          chown -R nobody:nobody /tmp/arch-build /tmp/arch-home
          chmod 0777 /arch-output
          cd /tmp/arch-build
          runuser -u nobody -- env \
            -u CC -u CXX -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS \
            -u CARGO_BUILD_RUSTFLAGS \
            -u CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER \
            -u CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER \
            -u CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS \
            -u CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS \
            HOME=/tmp/arch-home USER=nobody LOGNAME=nobody \
            makepkg --noconfirm --cleanbuild

          PACKAGE_FILE="$(find /arch-output -maxdepth 1 -type f \
            -name 'jpeg-viewer-*.pkg.tar.zst' -print -quit)"
          if [ -z "$PACKAGE_FILE" ]; then
            echo "No Arch package was generated; package output directory contents:"
            find /arch-output -maxdepth 2 -printf '%M %u:%g %p (%s bytes)\n'
            echo "Build directory top-level contents:"
            find /tmp/arch-build -maxdepth 1 -mindepth 1 -printf '%p\n'
            exit 1
          fi
          PACKAGE_NAME="$(basename "$PACKAGE_FILE")"
          case "$PACKAGE_NAME" in
            "jpeg-viewer-${ARCH_VERSION}-"*.pkg.tar.zst) ;;
            *)
              echo "Package version mismatch: expected ${ARCH_VERSION}, got ${PACKAGE_NAME}"
              exit 1
              ;;
          esac
          # Ensure the runner user can read the package produced by nobody.
          chmod 0644 "$PACKAGE_FILE"
          printf 'Created Arch package: %s\n' "$PACKAGE_FILE"
          ARCH_SCRIPT

          PACKAGE_FILE="$(find out -maxdepth 1 -type f -name 'jpeg-viewer-*.pkg.tar.zst' -print -quit)"
          test -n "$PACKAGE_FILE" || {
            echo 'Arch package is missing from the runner output directory:'
            find out -maxdepth 1 -printf '%M %u:%g %p (%s bytes)\n'
            exit 1
          }
          PACKAGE_NAME="$(basename "$PACKAGE_FILE")"
          case "$PACKAGE_NAME" in
            "jpeg-viewer-${ARCH_VERSION}-"*.pkg.tar.zst) ;;
            *) echo "Runner package version mismatch: expected ${ARCH_VERSION}, got ${PACKAGE_NAME}"; exit 1 ;;
          esac
          cp "$PACKAGE_FILE" "JPEG-Viewer-Arch-${{ matrix.arch }}.pkg.tar.zst"
          tar -tf "JPEG-Viewer-Arch-${{ matrix.arch }}.pkg.tar.zst" | grep -E 'usr/bin/jpeg_viewer|\.desktop$|metainfo|mime/packages|LICENSE'

      - name: Upload Arch package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-${{ matrix.arch }}
          path: JPEG-Viewer-Arch-${{ matrix.arch }}.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 9. Flatpak. Cargo sources are generated from the committed, version-synced lock.
  # ---------------------------------------------------------------------------
  build-flatpak:
    name: Build Flatpak ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder pipx
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive -y \
            flathub org.gnome.Platform//50 org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Install pinned Flatpak Cargo source generator
        run: |
          pipx install flatpak-cargo-generator==0.1.5
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Generate offline Cargo sources
        run: flatpak-cargo-generator Cargo.lock -o packaging/flatpak/cargo-sources.json

      - name: Build Flatpak bundle
        run: |
          # The app ref's branch is stable. Flatpak Builder otherwise defaults
          # to master when no branch is specified in the manifest.
          flatpak-builder --force-clean --default-branch=stable \
            --install-deps-from=flathub --repo=repo \
            build-dir packaging/flatpak/com.jpegviewer.JpegViewer.yml

          FLATPAK_ARCH="$(uname -m)"
          echo "Bundling com.jpegviewer.JpegViewer (branch=stable, arch=$FLATPAK_ARCH)"
          if ! flatpak build-bundle --arch="$FLATPAK_ARCH" \
            repo "JPEG-Viewer-Linux-${{ matrix.arch }}.flatpak" \
            com.jpegviewer.JpegViewer stable; then
            echo "Available refs in repository:"
            ostree --repo=repo refs || true
            find repo -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Upload Flatpak
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-${{ matrix.arch }}
          path: JPEG-Viewer-Linux-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 10. Verify all artifacts, generate checksums/notes, and publish the release.
  # ---------------------------------------------------------------------------
  release:
    name: Verify and publish GitHub Release
    needs:
      - validate
      - build-windows
      - package-windows-installers
      - build-linux-portable
      - build-debian
      - build-macos
      - build-appimage
      - build-rpm
      - build-arch
      - build-flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout full history for generated release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare versioned source metadata
        uses: ./.github/actions/prepare-release

      - name: Generate source dependency SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: JPEG-Viewer-SBOM.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: incoming

      - name: Flatten, validate, and checksum release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [[ -e "release-files/$name" ]]; then
              echo "Duplicate release asset filename: $name" >&2
              exit 1
            fi
            cp "$file" "release-files/$name"
          done < <(find incoming -type f -print0)
          install -m644 JPEG-Viewer-SBOM.spdx.json release-files/JPEG-Viewer-SBOM.spdx.json
          {
            echo "Tag: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Built by: GitHub Actions"
            echo "Windows installers are per-user and do not require administrator privileges."
            echo "Windows binaries are currently unsigned; SmartScreen reputation may be limited."
            echo "macOS bundles are currently unsigned and not notarized."
          } > release-files/BUILD-INFO.txt

          expected=(
            'JPEG-Viewer-Windows-x64.exe'
            'JPEG-Viewer-Windows-ARM64.exe'
            'JPEG-Viewer-Portable-x64.zip'
            'JPEG-Viewer-Portable-ARM64.zip'
            'JPEG-Viewer-Setup-x64.exe'
            'JPEG-Viewer-Setup-ARM64.exe'
            'JPEG-Viewer-Linux-x64.tar.gz'
            'JPEG-Viewer-Linux-ARM64.tar.gz'
            'JPEG-Viewer-Linux-x64.deb'
            'JPEG-Viewer-Linux-ARM64.deb'
            'JPEG-Viewer-macOS-Intel-x64.zip'
            'JPEG-Viewer-macOS-Intel-x64.dmg'
            'JPEG-Viewer-macOS-Apple-Silicon-ARM64.zip'
            'JPEG-Viewer-macOS-Apple-Silicon-ARM64.dmg'
            'JPEG-Viewer-Linux-x64.AppImage'
            'JPEG-Viewer-Linux-ARM64.AppImage'
            'JPEG-Viewer-Fedora-x64.rpm'
            'JPEG-Viewer-Fedora-ARM64.rpm'
            'JPEG-Viewer-Arch-x64.pkg.tar.zst'
            'JPEG-Viewer-Arch-ARM64.pkg.tar.zst'
            'JPEG-Viewer-Linux-x64.flatpak'
            'JPEG-Viewer-Linux-ARM64.flatpak'
            'JPEG-Viewer-SBOM.spdx.json'
            'BUILD-INFO.txt'
          )

          for asset in "${expected[@]}"; do
            if [[ ! -s "release-files/$asset" ]]; then
              echo "Required release asset is missing or empty: $asset" >&2
              exit 1
            fi
          done

          actual_count="$(find release-files -maxdepth 1 -type f | wc -l)"
          if [[ "$actual_count" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} assets but found $actual_count before checksums." >&2
            find release-files -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          (cd release-files && sha256sum "${expected[@]}" > SHA256SUMS)

          echo 'Release assets verified:'
          ls -lh release-files

      - name: Generate categorized release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          GENERATED_NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --method POST \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            --jq '.body')"

          cat > release-notes.md <<EOF
          # JPEG Viewer ${GITHUB_REF_NAME}

          GPU-accelerated desktop image viewer for Windows, Linux, and macOS.

          ## Downloads

          | Platform | Package | Download |
          |---|---|---|
          | Windows x64 | Per-user installer | [Setup](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Setup-x64.exe) |
          | Windows ARM64 | Per-user installer | [Setup](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Setup-ARM64.exe) |
          | Windows x64 | Portable | [ZIP](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Portable-x64.zip) |
          | Windows ARM64 | Portable | [ZIP](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Portable-ARM64.zip) |
          | macOS Intel | Disk image | [DMG](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-macOS-Intel-x64.dmg) |
          | macOS Intel | ZIP | [ZIP](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-macOS-Intel-x64.zip) |
          | macOS Apple Silicon | Disk image | [DMG](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-macOS-Apple-Silicon-ARM64.dmg) |
          | macOS Apple Silicon | ZIP | [ZIP](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-macOS-Apple-Silicon-ARM64.zip) |
          | Linux x64 | Portable | [TAR.GZ](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Linux-x64.tar.gz) |
          | Linux ARM64 | Portable | [TAR.GZ](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Linux-ARM64.tar.gz) |
          | Debian / Ubuntu x64 | Native package | [DEB](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Linux-x64.deb) |
          | Debian / Ubuntu ARM64 | Native package | [DEB](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Linux-ARM64.deb) |
          | Fedora x64 | Native package | [RPM](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Fedora-x64.rpm) |
          | Fedora ARM64 | Native package | [RPM](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Fedora-ARM64.rpm) |
          | Arch x64 | Native package | [PKG.TAR.ZST](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Arch-x64.pkg.tar.zst) |
          | Arch ARM64 | Native package | [PKG.TAR.ZST](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Arch-ARM64.pkg.tar.zst) |
          | Linux x64 | Flatpak bundle | [FLATPAK](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Linux-x64.flatpak) |
          | Linux ARM64 | Flatpak bundle | [FLATPAK](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Linux-ARM64.flatpak) |
          | Linux x64 | AppImage | [APPIMAGE](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Linux-x64.AppImage) |
          | Linux ARM64 | AppImage | [APPIMAGE](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-Linux-ARM64.AppImage) |

          **Checksums:** [SHA256SUMS](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/SHA256SUMS)

          **Software bill of materials:** [SPDX JSON](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/JPEG-Viewer-SBOM.spdx.json)

          Release assets also receive GitHub build-provenance attestations. Verify them with GitHub CLI using `gh attestation verify`.

          **Windows:** The Setup installers install for the current user only and do not require administrator privileges. Portable ZIPs do not install anything. Windows binaries are currently unsigned, so SmartScreen may show a reputation warning.

          **macOS:** These packages are currently unsigned and not notarized. Gatekeeper may require users to approve the application manually.

          ## What's Changed

          EOF
          printf '%s\n' "$GENERATED_NOTES" >> release-notes.md

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'release-files/*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: JPEG Viewer ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-files/*
          fail_on_unmatched_files: true
          prerelease: ${{ env.JPEG_VIEWER_IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.JPEG_VIEWER_IS_PRERELEASE != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

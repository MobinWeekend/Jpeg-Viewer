      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.jpegviewer.JpegViewer.yml
          bundle: JPEG-View-Linux-ARM64.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          arch: aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JPEG-View-Linux-ARM64-Flatpak
          path: JPEG-View-Linux-ARM64.flatpak


  # ============================================================
  # GitHub Release
  # ============================================================

  release:
    name: Create GitHub Release

    needs:
      - build-windows-x64
      - build-windows-arm64
      - build-linux-x64
      - build-linux-arm64
      - build-debian-x64
      - build-debian-arm64
      - build-flatpak-x86_64
      - build-flatpak-arm64

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" --reverse)
          else
            CHANGELOG=$(git log "$PREVIOUS_TAG..HEAD" \
              --pretty=format:"- %s (%an)" \
              --reverse)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Initial release or no new commits since last tag"
          fi

          {
            echo "body<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten release files
        shell: bash
        run: |
          mkdir -p release-files

          find release \
            -type f \
            -exec cp {} release-files/ \;

          echo "Release files:"
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            # JPEG Viewer ${{ github.ref_name }}

            **Version:** `${{ steps.version.outputs.version }}`

            ## Downloads

            ### Windows

            - **Windows x64** — `JPEG-View-Windows-x64.exe`
            - **Windows ARM64** — `JPEG-View-Windows-ARM64.exe`

            Portable executables. No installation required.

            ### Linux

            - **Linux x64 Portable** — `JPEG-View-Linux-x64.tar.gz`
            - **Linux ARM64 Portable** — `JPEG-View-Linux-ARM64.tar.gz`
            - **Debian / Ubuntu x64** — `JPEG-View-Linux-x64.deb`
            - **Debian / Ubuntu ARM64** — `JPEG-View-Linux-ARM64.deb`
            - **Flatpak x86_64** — `JPEG-View-Linux-x86_64.flatpak`
            - **Flatpak ARM64** — `JPEG-View-Linux-ARM64.flatpak`

            ## What's Changed

            ${{ steps.changelog.outputs.body }}

            ## Linux Portable

            Extract:

            ```bash
            tar -xzf JPEG-View-Linux-x64.tar.gz
            cd JPEG-View
            ./jpeg_viewer
            ```

            If necessary:

            ```bash
            chmod +x jpeg_viewer
            ```

          files: |
            release-files/*
          generate_release_notes: false

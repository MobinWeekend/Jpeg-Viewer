name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: jpeg_viewer
  APP_ID: com.jpegviewer.JpegViewer

jobs:

  # ============================================================
  # Windows x64
  # ============================================================

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".Substring(1)

          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$') {
              throw "Invalid release version: $version"
          }

          Write-Host "Building version $version"

          cargo set-version $version

      - name: Verify Cargo.toml and Cargo.lock
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".Substring(1)

          $metadata = cargo metadata --locked --no-deps --format-version 1 |
            ConvertFrom-Json

          $package = $metadata.packages |
            Where-Object { $_.name -eq "${env:APP_NAME}" } |
            Select-Object -First 1

          if (-not $package) {
              throw "Could not find package ${env:APP_NAME}."
          }

          Write-Host "Cargo version:  $($package.version)"
          Write-Host "Git tag version: $version"

          if ($package.version -ne $version) {
              throw "Cargo package version does not match Git tag."
          }

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          Copy-Item `
            "target\release\jpeg_viewer.exe" `
            "JPEG-View-Windows-x64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JPEG-View-Windows-x64
          path: JPEG-View-Windows-x64.exe


  # ============================================================
  # Windows ARM64
  # ============================================================

  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2

      - name: Verify Cargo.toml and Cargo.lock
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".Substring(1)

          $metadata = cargo metadata --locked --no-deps --format-version 1 |
            ConvertFrom-Json

          $package = $metadata.packages |
            Where-Object { $_.name -eq "${env:APP_NAME}" } |
            Select-Object -First 1

          if (-not $package) {
              throw "Could not find package ${env:APP_NAME}."
          }

          Write-Host "Cargo version:  $($package.version)"
          Write-Host "Git tag version: $version"

          if ($package.version -ne $version) {
              throw "Cargo package version does not match Git tag."
          }

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          Copy-Item `
            "target\release\jpeg_viewer.exe" `
            "JPEG-View-Windows-ARM64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JPEG-View-Windows-ARM64
          path: JPEG-View-Windows-ARM64.exe


  # ============================================================
  # Linux x64 Portable
  # ============================================================

  build-linux-x64:
    name: Build Linux x64 Portable
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          echo "Building version $VERSION"

          cargo set-version "$VERSION"

      - name: Verify Cargo.toml and Cargo.lock
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          CARGO_VERSION=$(cargo metadata \
            --locked \
            --no-deps \
            --format-version 1 |
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          package = next(
              p for p in data["packages"]
              if p["name"] == "jpeg_viewer"
          )

          print(package["version"])
          ')

          echo "Cargo version:   $CARGO_VERSION"
          echo "Git tag version: $VERSION"

          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "Cargo package version does not match Git tag."
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p package/JPEG-View

          cp target/release/jpeg_viewer \
            package/JPEG-View/jpeg_viewer

          cp README.md \
            package/JPEG-View/README.md

          chmod +x package/JPEG-View/jpeg_viewer

          tar -C package \
            -czf JPEG-View-Linux-x64.tar.gz \
            JPEG-View

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JPEG-View-Linux-x64
          path: JPEG-View-Linux-x64.tar.gz



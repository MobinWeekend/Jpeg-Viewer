name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: jpeg_viewer
  APP_ID: com.jpegviewer.JpegViewer

jobs:

  # ============================================================
  # Windows x64
  # ============================================================

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".Substring(1)

          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$') {
              throw "Invalid release version: $version"
          }

          cargo set-version $version

      - name: Update Cargo.lock
        run: cargo check

      - name: Verify version
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".Substring(1)

          $metadata = cargo metadata --format-version 1 --no-deps |
            ConvertFrom-Json

          $package = $metadata.packages |
            Where-Object { $_.name -eq "jpeg_viewer" } |
            Select-Object -First 1

          if ($null -eq $package) {
              throw "jpeg_viewer package was not found."
          }

          if ($package.version -ne $version) {
              throw "Cargo.toml version does not match Git tag."
          }

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          Copy-Item `
            "target\release\jpeg_viewer.exe" `
            "JPEG-View-Windows-x64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Windows-x64
          path: JPEG-View-Windows-x64.exe


  # ============================================================
  # Windows ARM64
  # ============================================================

  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".Substring(1)

          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$') {
              throw "Invalid release version: $version"
          }

          cargo set-version $version

      - name: Update Cargo.lock
        run: cargo check

      - name: Verify version
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".Substring(1)

          $metadata = cargo metadata --format-version 1 --no-deps |
            ConvertFrom-Json

          $package = $metadata.packages |
            Where-Object { $_.name -eq "jpeg_viewer" } |
            Select-Object -First 1

          if ($null -eq $package) {
              throw "jpeg_viewer package was not found."
          }

          if ($package.version -ne $version) {
              throw "Cargo.toml version does not match Git tag."
          }

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          Copy-Item `
            "target\release\jpeg_viewer.exe" `
            "JPEG-View-Windows-ARM64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Windows-ARM64
          path: JPEG-View-Windows-ARM64.exe


  # ============================================================
  # Linux x64 Portable
  # ============================================================

  build-linux-x64:
    name: Build Linux x64 Portable
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          cargo set-version "$VERSION"

      - name: Update Cargo.lock
        run: cargo check

      - name: Verify version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          CARGO_VERSION=$(cargo metadata \
            --no-deps \
            --format-version 1 |
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          package = next(
              p for p in data["packages"]
              if p["name"] == "jpeg_viewer"
          )

          print(package["version"])
          ')

          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "Cargo.toml version does not match Git tag."
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p package/JPEG-View

          cp target/release/jpeg_viewer \
            package/JPEG-View/jpeg_viewer

          cp README.md \
            package/JPEG-View/README.md

          chmod +x package/JPEG-View/jpeg_viewer

          tar -C package \
            -czf JPEG-View-Linux-x64.tar.gz \
            JPEG-View

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Linux-x64
          path: JPEG-View-Linux-x64.tar.gz


  # ============================================================
  # Linux ARM64 Portable
  # ============================================================

  build-linux-arm64:
    name: Build Linux ARM64 Portable
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          cargo set-version "$VERSION"

      - name: Update Cargo.lock
        run: cargo check

      - name: Verify version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          CARGO_VERSION=$(cargo metadata \
            --no-deps \
            --format-version 1 |
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          package = next(
              p for p in data["packages"]
              if p["name"] == "jpeg_viewer"
          )

          print(package["version"])
          ')

          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "Cargo.toml version does not match Git tag."
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p package/JPEG-View

          cp target/release/jpeg_viewer \
            package/JPEG-View/jpeg_viewer

          cp README.md \
            package/JPEG-View/README.md

          chmod +x package/JPEG-View/jpeg_viewer

          tar -C package \
            -czf JPEG-View-Linux-ARM64.tar.gz \
            JPEG-View

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Linux-ARM64
          path: JPEG-View-Linux-ARM64.tar.gz


  # ============================================================
  # Debian x64
  # ============================================================

  build-debian-x64:
    name: Build Debian x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            dpkg \
            dpkg-dev \
            libdbus-1-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          cargo set-version "$VERSION"

      - name: Update Cargo.lock
        run: cargo check

      - name: Build
        run: cargo build --release --locked

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build Debian package
        run: cargo deb --no-build

      - name: Rename package
        run: |
          DEB=$(find target/debian -name "*.deb" | head -n 1)

          if [ -z "$DEB" ]; then
            echo "Debian package was not created."
            exit 1
          fi

          cp "$DEB" JPEG-View-Linux-x64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Linux-x64-deb
          path: JPEG-View-Linux-x64.deb


  # ============================================================
  # Debian ARM64
  # ============================================================

  build-debian-arm64:
    name: Build Debian ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            dpkg \
            dpkg-dev \
            libdbus-1-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          cargo set-version "$VERSION"

      - name: Update Cargo.lock
        run: cargo check

      - name: Build
        run: cargo build --release --locked

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build Debian package
        run: cargo deb --no-build

      - name: Rename package
        run: |
          DEB=$(find target/debian -name "*.deb" | head -n 1)

          if [ -z "$DEB" ]; then
            echo "Debian package was not created."
            exit 1
          fi

          cp "$DEB" JPEG-View-Linux-ARM64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Linux-ARM64-deb
          path: JPEG-View-Linux-ARM64.deb



  # ============================================================
  # macOS Intel and Apple Silicon
  # ============================================================

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Intel-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
          - arch: Apple-Silicon-ARM64
            runner: macos-15
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target "${{ matrix.rust_target }}"
      - name: Package app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="JPEG Viewer.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.rust_target }}/release/jpeg_viewer" "$APP/Contents/MacOS/jpeg_viewer"
          mkdir -p icon.iconset
          for size in 16 32 64 128 256 512; do sips -z "$size" "$size" assets/icons/icon.png --out "icon.iconset/icon_${size}x${size}.png" >/dev/null; done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/jpeg_viewer.icns"
          sed -e "s/0.0.0/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/jpeg_viewer"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "JPEG-View-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-macOS-${{ matrix.arch }}
          path: JPEG-View-macOS-${{ matrix.arch }}.zip

  # ============================================================
  # Linux AppImage x64 and ARM64
  # ============================================================

  build-appimage:
    name: Build AppImage ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            appimage_arch: x86_64
          - arch: ARM64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libdbus-1-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev wget file
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target "${{ matrix.rust_target }}"
      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp "target/${{ matrix.rust_target }}/release/jpeg_viewer" AppDir/usr/bin/jpeg_viewer
          cp packaging/linux/com.jpegviewer.JpegViewer.desktop AppDir/com.jpegviewer.JpegViewer.desktop
          cp packaging/linux/com.jpegviewer.JpegViewer.desktop AppDir/usr/share/applications/com.jpegviewer.JpegViewer.desktop
          cp packaging/icons/512x512/com.jpegviewer.JpegViewer.png AppDir/jpeg_viewer.png
          cp assets/icons/icon.png AppDir/usr/share/icons/hicolor/512x512/apps/com.jpegviewer.JpegViewer.png
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/jpeg_viewer" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/jpeg_viewer
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.appimage_arch }}.AppImage" -O linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage
          ARCH="${{ matrix.appimage_arch }}" ./linuxdeploy.AppImage --appdir AppDir --desktop-file AppDir/com.jpegviewer.JpegViewer.desktop --icon-file AppDir/jpeg_viewer.png --output appimage
          APPIMAGE_FILE="$(find . -maxdepth 1 -type f -iname '*.appimage' ! -name 'linuxdeploy.AppImage' -print -quit)"
          if [ -z "$APPIMAGE_FILE" ]; then
            echo "linuxdeploy did not produce an AppImage; files in workspace:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi
          mv "$APPIMAGE_FILE" "JPEG-View-Linux-${{ matrix.arch }}.AppImage"
      - uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Linux-${{ matrix.arch }}-AppImage
          path: JPEG-View-Linux-${{ matrix.arch }}.AppImage

  # ============================================================
  # Linux RPM packages (Fedora-compatible)
  # ============================================================

  build-rpm:
    name: Build Fedora RPM ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: ARM64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libdbus-1-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target "${{ matrix.rust_target }}"
      - name: Create RPM staging tree
        run: |
          mkdir -p stage/usr/bin stage/usr/share/applications stage/usr/share/icons/hicolor/512x512/apps
          cp "target/${{ matrix.rust_target }}/release/jpeg_viewer" stage/usr/bin/jpeg_viewer
          cp packaging/linux/com.jpegviewer.JpegViewer.desktop stage/usr/share/applications/
          cp assets/icons/icon.png stage/usr/share/icons/hicolor/512x512/apps/com.jpegviewer.JpegViewer.png
          tar -czf stage.tar.gz -C stage .
          cat > packaging/linux/jpeg-viewer.spec <<'EOF'
          Name: jpeg-viewer
          Version: 0.1.0
          Release: 1%{?dist}
          Summary: GPU-accelerated image viewer
          License: GPL-3.0-only
          BuildArch: noarch
          %description
          JPEG Viewer is a GPU-accelerated desktop image viewer.
          %install
          mkdir -p %{buildroot}/usr/bin
          install -m755 %{_sourcedir}/jpeg_viewer %{buildroot}/usr/bin/jpeg_viewer
          %files
          /usr/bin/jpeg_viewer
          EOF
      - name: Build RPM using fpm
        run: |
          sudo gem install --no-document fpm
          fpm -s dir -t rpm -n jpeg-viewer -v "${GITHUB_REF_NAME#v}" --license 'GPL-3.0-only' --description 'GPU-accelerated image viewer' --architecture "$( [ '${{ matrix.arch }}' = 'x64' ] && echo x86_64 || echo aarch64 )" -C stage .
          mv jpeg-viewer-*.rpm "JPEG-View-Fedora-${{ matrix.arch }}.rpm"
      - uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Fedora-${{ matrix.arch }}-RPM
          path: JPEG-View-Fedora-${{ matrix.arch }}.rpm

  # ============================================================
  # Arch Linux package
  # ============================================================

  build-arch:
    name: Build Arch Linux package ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build package in Arch Linux container
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE=archlinux:latest
          if [ "${{ matrix.arch }}" = "ARM64" ]; then IMAGE=menci/archlinuxarm:base-devel; fi
          docker run --privileged --rm -e GITHUB_REF_NAME="$GITHUB_REF_NAME" -e VERSION="$VERSION" -v "$PWD:/src" -w /src "$IMAGE" bash -lc '
            if [ "$(uname -m)" = "aarch64" ]; then pacman-key --init; pacman-key --populate archlinuxarm || true; fi
            pacman -Syu --noconfirm --needed base-devel rust cargo pkgconf dbus libx11 libxkbcommon wayland mesa git
            useradd -m builder || true
            sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD
            sed -i "s/cargo build --release --locked/cargo build --release/" packaging/arch/PKGBUILD
            sed -i "s|source=.*|source=('jpeg-viewer::git+https://github.com/MobinWeekend/Jpeg-Viewer.git#tag=${GITHUB_REF_NAME}')|" packaging/arch/PKGBUILD
            mkdir -p /tmp/arch-build
            cp packaging/arch/PKGBUILD /tmp/arch-build/PKGBUILD
            chown -R builder:builder /tmp/arch-build
            su builder -c "cd /tmp/arch-build && makepkg --syncdeps --noconfirm --cleanbuild"
            mkdir -p /src/out
            cp /tmp/arch-build/*.pkg.tar.zst /src/out/
          '
          cp out/*.pkg.tar.zst "JPEG-View-Arch-${{ matrix.arch }}.pkg.tar.zst"
      - uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Arch-${{ matrix.arch }}
          path: JPEG-View-Arch-${{ matrix.arch }}.pkg.tar.zst

  # ============================================================
  # Flatpak bundles
  # ============================================================

  build-flatpak:
    name: Build Flatpak ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive -y flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Generate Flatpak Cargo sources
        run: |
          python3 -m pip install --user --break-system-packages requests tomlkit aiohttp
          curl -fsSL https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py -o /tmp/flatpak-cargo-generator.py
          python3 /tmp/flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --force-clean --install-deps-from=flathub --repo=repo build-dir packaging/flatpak/com.jpegviewer.JpegViewer.yml
          flatpak build-bundle repo "JPEG-View-Linux-${{ matrix.arch }}.flatpak" com.jpegviewer.JpegViewer
      - uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Linux-${{ matrix.arch }}-Flatpak
          path: JPEG-View-Linux-${{ matrix.arch }}.flatpak


  # ============================================================
  # GitHub Release
  # ============================================================

  release:
    name: Create GitHub Release

    needs:
      - build-windows-x64
      - build-windows-arm64
      - build-linux-x64
      - build-linux-arm64
      - build-debian-x64
      - build-debian-arm64
      - build-macos
      - build-appimage
      - build-rpm
      - build-arch
      - build-flatpak

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREVIOUS_TAG=$(
            git describe \
              --tags \
              --abbrev=0 \
              HEAD^ 2>/dev/null || echo ""
          )

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(
              git log \
                --pretty=format:"- %s (%an)" \
                --reverse
            )
          else
            CHANGELOG=$(
              git log \
                "$PREVIOUS_TAG..HEAD" \
                --pretty=format:"- %s (%an)" \
                --reverse
            )
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Initial release or no new commits since last tag"
          fi

          {
            echo "body<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release

      - name: Flatten release files
        shell: bash
        run: |
          mkdir -p release-files

          find release \
            -type f \
            -exec cp {} release-files/ \;

          echo "Release files:"
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            # JPEG Viewer ${{ github.ref_name }}

            **Version:** `${{ steps.version.outputs.version }}`

            ## Downloads

            Assets below are attached to this release. Select the package matching your operating system and CPU architecture.

            ### Windows
            - [Windows x64 (.exe)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-Windows-x64.exe)
            - [Windows ARM64 (.exe)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-Windows-ARM64.exe)

            ### macOS
            - [Intel Mac (.zip app bundle)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-macOS-Intel-x64.zip)
            - [Apple Silicon M-series (.zip app bundle)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-macOS-Apple-Silicon-ARM64.zip)

            ### Linux — portable
            - [Linux x64 (.tar.gz)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-Linux-x64.tar.gz)
            - [Linux ARM64 (.tar.gz)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-Linux-ARM64.tar.gz)
            - [AppImage x64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-Linux-x64.AppImage)
            - [AppImage ARM64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-Linux-ARM64.AppImage)
            - [Flatpak x64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-Linux-x64.flatpak)
            - [Flatpak ARM64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-Linux-ARM64.flatpak)

            ### Linux — distribution packages
            - [Debian / Ubuntu x64 (.deb)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-Linux-x64.deb)
            - [Debian / Ubuntu ARM64 (.deb)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-Linux-ARM64.deb)
            - [Fedora x64 (.rpm)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-Fedora-x64.rpm)
            - [Fedora ARM64 (.rpm)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-Fedora-ARM64.rpm)
            - [Arch Linux x64 (.pkg.tar.zst)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-Arch-x64.pkg.tar.zst)
            - [Arch Linux ARM64 (.pkg.tar.zst)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JPEG-View-Arch-ARM64.pkg.tar.zst)

            ## What's Changed

            ${{ steps.changelog.outputs.body }}

            ## Linux Portable

            Extract:

            ```bash
            tar -xzf JPEG-View-Linux-x64.tar.gz
            cd JPEG-View
            ./jpeg_viewer
            ```

            If necessary:

            ```bash
            chmod +x jpeg_viewer
            ```

          files: |
            release-files/*
          generate_release_notes: false

name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: jpeg_viewer
  APP_ID: com.jpegviewer.JpegViewer

jobs:

  # ============================================================
  # Windows x64
  # ============================================================

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".Substring(1)

          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$') {
              throw "Invalid release version: $version"
          }

          cargo set-version $version

      - name: Update Cargo.lock
        run: cargo check

      - name: Verify version
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".Substring(1)

          $metadata = cargo metadata --format-version 1 --no-deps |
            ConvertFrom-Json

          $package = $metadata.packages |
            Where-Object { $_.name -eq "jpeg_viewer" } |
            Select-Object -First 1

          if ($null -eq $package) {
              throw "jpeg_viewer package was not found."
          }

          if ($package.version -ne $version) {
              throw "Cargo.toml version does not match Git tag."
          }

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          Copy-Item `
            "target\release\jpeg_viewer.exe" `
            "JPEG-View-Windows-x64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Windows-x64
          path: JPEG-View-Windows-x64.exe


  # ============================================================
  # Windows ARM64
  # ============================================================

  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".Substring(1)

          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$') {
              throw "Invalid release version: $version"
          }

          cargo set-version $version

      - name: Update Cargo.lock
        run: cargo check

      - name: Verify version
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".Substring(1)

          $metadata = cargo metadata --format-version 1 --no-deps |
            ConvertFrom-Json

          $package = $metadata.packages |
            Where-Object { $_.name -eq "jpeg_viewer" } |
            Select-Object -First 1

          if ($null -eq $package) {
              throw "jpeg_viewer package was not found."
          }

          if ($package.version -ne $version) {
              throw "Cargo.toml version does not match Git tag."
          }

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          Copy-Item `
            "target\release\jpeg_viewer.exe" `
            "JPEG-View-Windows-ARM64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Windows-ARM64
          path: JPEG-View-Windows-ARM64.exe


  # ============================================================
  # Linux x64 Portable
  # ============================================================

  build-linux-x64:
    name: Build Linux x64 Portable
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          cargo set-version "$VERSION"

      - name: Update Cargo.lock
        run: cargo check

      - name: Verify version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          CARGO_VERSION=$(cargo metadata \
            --no-deps \
            --format-version 1 |
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          package = next(
              p for p in data["packages"]
              if p["name"] == "jpeg_viewer"
          )

          print(package["version"])
          ')

          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "Cargo.toml version does not match Git tag."
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p package/JPEG-View

          cp target/release/jpeg_viewer \
            package/JPEG-View/jpeg_viewer

          cp README.md \
            package/JPEG-View/README.md

          chmod +x package/JPEG-View/jpeg_viewer

          tar -C package \
            -czf JPEG-View-Linux-x64.tar.gz \
            JPEG-View

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Linux-x64
          path: JPEG-View-Linux-x64.tar.gz


  # ============================================================
  # Linux ARM64 Portable
  # ============================================================

  build-linux-arm64:
    name: Build Linux ARM64 Portable
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          cargo set-version "$VERSION"

      - name: Update Cargo.lock
        run: cargo check

      - name: Verify version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          CARGO_VERSION=$(cargo metadata \
            --no-deps \
            --format-version 1 |
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          package = next(
              p for p in data["packages"]
              if p["name"] == "jpeg_viewer"
          )

          print(package["version"])
          ')

          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "Cargo.toml version does not match Git tag."
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p package/JPEG-View

          cp target/release/jpeg_viewer \
            package/JPEG-View/jpeg_viewer

          cp README.md \
            package/JPEG-View/README.md

          chmod +x package/JPEG-View/jpeg_viewer

          tar -C package \
            -czf JPEG-View-Linux-ARM64.tar.gz \
            JPEG-View

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Linux-ARM64
          path: JPEG-View-Linux-ARM64.tar.gz


  # ============================================================
  # Debian x64
  # ============================================================

  build-debian-x64:
    name: Build Debian x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            dpkg \
            dpkg-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          cargo set-version "$VERSION"

      - name: Update Cargo.lock
        run: cargo check

      - name: Build
        run: cargo build --release --locked

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build Debian package
        run: cargo deb --no-build

      - name: Rename package
        run: |
          DEB=$(find target/debian -name "*.deb" | head -n 1)

          if [ -z "$DEB" ]; then
            echo "Debian package was not created."
            exit 1
          fi

          cp "$DEB" JPEG-View-Linux-x64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: JPEG-View-Linux-x64-deb
          path: JPEG-View-Linux-x64.deb


  # ============================================================
  # Debian ARM64
  # ============================================================

  build-debian-arm64:
    name: Build Debian ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:

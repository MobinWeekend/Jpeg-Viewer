name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Build downloadable artifacts only, or publish a complete GitHub Release"
        required: true
        type: choice
        default: artifacts-only
        options:
          - artifacts-only
          - full-release
      version:
        description: "Application version to build (for example 0.1.14 or v0.1.14)"
        required: true
        type: string
        default: v0.1.13
      platform_selection:
        description: "Build all targets, or only the platform/architecture checkboxes below"
        required: true
        type: choice
        default: all
        options:
          - all
          - selected
      build_windows_x64:
        description: "Windows x64 binary, portable ZIP, and per-user installer"
        required: true
        type: boolean
        default: false
      build_windows_arm64:
        description: "Windows ARM64 binary, portable ZIP, and per-user installer"
        required: true
        type: boolean
        default: false
      build_linux_portable_x64:
        description: "Linux x64 portable TAR.GZ"
        required: true
        type: boolean
        default: false
      build_linux_portable_arm64:
        description: "Linux ARM64 portable TAR.GZ"
        required: true
        type: boolean
        default: false
      build_debian_x64:
        description: "Debian / Ubuntu x64 DEB"
        required: true
        type: boolean
        default: false
      build_debian_arm64:
        description: "Debian / Ubuntu ARM64 DEB"
        required: true
        type: boolean
        default: false
      build_macos_intel:
        description: "macOS Intel x64 ZIP and DMG"
        required: true
        type: boolean
        default: false
      build_macos_apple_silicon:
        description: "macOS Apple Silicon ARM64 ZIP and DMG"
        required: true
        type: boolean
        default: false
      build_appimage_x64:
        description: "Linux x64 AppImage"
        required: true
        type: boolean
        default: false
      build_appimage_arm64:
        description: "Linux ARM64 AppImage"
        required: true
        type: boolean
        default: false
      build_rpm_x64:
        description: "Fedora-compatible x64 RPM"
        required: true
        type: boolean
        default: false
      build_rpm_arm64:
        description: "Fedora-compatible ARM64 RPM"
        required: true
        type: boolean
        default: false
      build_arch_x64:
        description: "Arch Linux x64 package"
        required: true
        type: boolean
        default: false
      build_arch_arm64:
        description: "Arch Linux ARM64 package"
        required: true
        type: boolean
        default: false
      build_flatpak_x64:
        description: "Linux x64 Flatpak bundle"
        required: true
        type: boolean
        default: false
      build_flatpak_arm64:
        description: "Linux ARM64 Flatpak bundle"
        required: true
        type: boolean
        default: false
      run_validation:
        description: "Run the Linux and Windows validation/test jobs before building (slower)"
        required: true
        type: boolean
        default: false
      arch_x64_image:
        description: "Docker image reference for the x64 Arch build (tag or @sha256 digest)"
        required: true
        type: string
        default: archlinux/archlinux:base-devel-20261120.0.628918
      arch_arm64_image:
        description: "Docker image reference for the ARM64 Arch build (tag or @sha256 digest)"
        required: true
        type: string
        default: menci/archlinuxarm:base-devel-20261120.44687052260

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Empty for tag pushes; manual runs use the version entered in workflow_dispatch.
  JPEG_VIEWER_RELEASE_TAG: ${{ inputs.version && (startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version)) }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Resolve the exact platform/architecture build matrix.
  # Tag pushes and full releases always select every target.
  # ---------------------------------------------------------------------------
  select-builds:
    name: Select platform build targets
    runs-on: ubuntu-24.04
    outputs:
      windows_matrix: ${{ steps.select.outputs.windows_matrix }}
      windows_enabled: ${{ steps.select.outputs.windows_enabled }}
      linux_portable_matrix: ${{ steps.select.outputs.linux_portable_matrix }}
      linux_portable_enabled: ${{ steps.select.outputs.linux_portable_enabled }}
      debian_matrix: ${{ steps.select.outputs.debian_matrix }}
      debian_enabled: ${{ steps.select.outputs.debian_enabled }}
      macos_matrix: ${{ steps.select.outputs.macos_matrix }}
      macos_enabled: ${{ steps.select.outputs.macos_enabled }}
      appimage_matrix: ${{ steps.select.outputs.appimage_matrix }}
      appimage_enabled: ${{ steps.select.outputs.appimage_enabled }}
      rpm_matrix: ${{ steps.select.outputs.rpm_matrix }}
      rpm_enabled: ${{ steps.select.outputs.rpm_enabled }}
      arch_matrix: ${{ steps.select.outputs.arch_matrix }}
      arch_enabled: ${{ steps.select.outputs.arch_enabled }}
      flatpak_matrix: ${{ steps.select.outputs.flatpak_matrix }}
      flatpak_enabled: ${{ steps.select.outputs.flatpak_enabled }}
    steps:
      - name: Generate selected build matrices
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          PLATFORM_SELECTION: ${{ inputs.platform_selection }}
          BUILD_WINDOWS_X64: ${{ inputs.build_windows_x64 }}
          BUILD_WINDOWS_ARM64: ${{ inputs.build_windows_arm64 }}
          BUILD_LINUX_PORTABLE_X64: ${{ inputs.build_linux_portable_x64 }}
          BUILD_LINUX_PORTABLE_ARM64: ${{ inputs.build_linux_portable_arm64 }}
          BUILD_DEBIAN_X64: ${{ inputs.build_debian_x64 }}
          BUILD_DEBIAN_ARM64: ${{ inputs.build_debian_arm64 }}
          BUILD_MACOS_INTEL: ${{ inputs.build_macos_intel }}
          BUILD_MACOS_APPLE_SILICON: ${{ inputs.build_macos_apple_silicon }}
          BUILD_APPIMAGE_X64: ${{ inputs.build_appimage_x64 }}
          BUILD_APPIMAGE_ARM64: ${{ inputs.build_appimage_arm64 }}
          BUILD_RPM_X64: ${{ inputs.build_rpm_x64 }}
          BUILD_RPM_ARM64: ${{ inputs.build_rpm_arm64 }}
          BUILD_ARCH_X64: ${{ inputs.build_arch_x64 }}
          BUILD_ARCH_ARM64: ${{ inputs.build_arch_arm64 }}
          BUILD_FLATPAK_X64: ${{ inputs.build_flatpak_x64 }}
          BUILD_FLATPAK_ARM64: ${{ inputs.build_flatpak_arm64 }}
          RUN_VALIDATION: ${{ inputs.run_validation }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          env = os.environ
          manual = env.get("EVENT_NAME") == "workflow_dispatch"
          full_release = not manual or env.get("MODE") == "full-release"
          all_targets = full_release or env.get("PLATFORM_SELECTION", "all") == "all"

          specs = {
              "windows": [
                  ("BUILD_WINDOWS_X64", {"arch": "x64", "runner": "windows-2025"}),
                  ("BUILD_WINDOWS_ARM64", {"arch": "ARM64", "runner": "windows-11-arm"}),
              ],
              "linux_portable": [
                  ("BUILD_LINUX_PORTABLE_X64", {"arch": "x64", "runner": "ubuntu-22.04", "rust_target": "x86_64-unknown-linux-gnu"}),
                  ("BUILD_LINUX_PORTABLE_ARM64", {"arch": "ARM64", "runner": "ubuntu-22.04-arm", "rust_target": "aarch64-unknown-linux-gnu"}),
              ],
              "debian": [
                  ("BUILD_DEBIAN_X64", {"arch": "x64", "runner": "ubuntu-22.04", "rust_target": "x86_64-unknown-linux-gnu"}),
                  ("BUILD_DEBIAN_ARM64", {"arch": "ARM64", "runner": "ubuntu-22.04-arm", "rust_target": "aarch64-unknown-linux-gnu"}),
              ],
              "macos": [
                  ("BUILD_MACOS_INTEL", {"arch": "Intel-x64", "runner": "macos-15-intel", "rust_target": "x86_64-apple-darwin"}),
                  ("BUILD_MACOS_APPLE_SILICON", {"arch": "Apple-Silicon-ARM64", "runner": "macos-15", "rust_target": "aarch64-apple-darwin"}),
              ],
              "appimage": [
                  ("BUILD_APPIMAGE_X64", {"arch": "x64", "runner": "ubuntu-22.04", "rust_target": "x86_64-unknown-linux-gnu", "appimage_arch": "x86_64"}),
                  ("BUILD_APPIMAGE_ARM64", {"arch": "ARM64", "runner": "ubuntu-22.04-arm", "rust_target": "aarch64-unknown-linux-gnu", "appimage_arch": "aarch64"}),
              ],
              "rpm": [
                  ("BUILD_RPM_X64", {"arch": "x64", "runner": "ubuntu-22.04", "rust_target": "x86_64-unknown-linux-gnu", "rpm_arch": "x86_64"}),
                  ("BUILD_RPM_ARM64", {"arch": "ARM64", "runner": "ubuntu-22.04-arm", "rust_target": "aarch64-unknown-linux-gnu", "rpm_arch": "aarch64"}),
              ],
              "arch": [
                  ("BUILD_ARCH_X64", {"arch": "x64", "runner": "ubuntu-24.04"}),
                  ("BUILD_ARCH_ARM64", {"arch": "ARM64", "runner": "ubuntu-24.04-arm"}),
              ],
              "flatpak": [
                  ("BUILD_FLATPAK_X64", {"arch": "x64", "runner": "ubuntu-24.04"}),
                  ("BUILD_FLATPAK_ARM64", {"arch": "ARM64", "runner": "ubuntu-24.04-arm"}),
              ],
          }

          if not all_targets:
              selected_count = sum(
                  env.get(input_name, "false").lower() == "true"
                  for variants in specs.values()
                  for input_name, _ in variants
              )
              if selected_count == 0:
                  print(
                      "::error::No build target selected. Choose 'all', or set "
                      "Platform selection to 'selected' and check at least one target.",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          output = open(env["GITHUB_OUTPUT"], "a", encoding="utf-8")
          print("Build selection:")
          for family, variants in specs.items():
              include = [
                  item for input_name, item in variants
                  if all_targets or env.get(input_name, "false").lower() == "true"
              ]
              enabled = bool(include)
              # Keep a valid inert matrix when no targets in this family were selected;
              # the job-level condition prevents a runner from being allocated.
              matrix = {"include": include or [{"arch": "__skip__", "runner": "ubuntu-24.04"}]}
              output.write(f"{family}_matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              output.write(f"{family}_enabled={str(enabled).lower()}\n")
              chosen = ", ".join(item["arch"] for item in include) if include else "skipped"
              print(f"  {family}: {chosen}")
          output.close()
          print(f"  validation: {'required' if full_release or env.get('RUN_VALIDATION') == 'true' else 'skipped for faster artifact testing'}")
          PY
  # ---------------------------------------------------------------------------
  # 2. Optional fast-path validation. Required for tag pushes and full releases.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full-release' || inputs.run_validation }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Verify locked Cargo metadata
        run: cargo metadata --locked --no-deps --format-version 1 > $null
        if: runner.os == 'Windows'

      - name: Verify locked Cargo metadata (Linux)
        if: runner.os != 'Windows'
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Validate package metadata
        run: python scripts/validate_packaging.py

      - name: Test release metadata helpers
        run: python -m unittest discover -s scripts/tests -v

      - name: Run tests
        run: cargo test --locked

  # ---------------------------------------------------------------------------
  # 2. Native Windows binaries and portable ZIPs.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows ${{ matrix.arch }}
    if: ${{ always() && needs.select-builds.result == 'success' && needs.select-builds.outputs.windows_enabled == 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    needs: [validate, select-builds]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.windows_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package executable and portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:JPEG_VIEWER_VERSION
          $arch = '${{ matrix.arch }}'
          $dist = 'dist/windows'
          $portable = Join-Path $dist 'portable'
          New-Item -ItemType Directory -Force -Path $dist, $portable | Out-Null

          $binary = 'target\release\jpeg_viewer.exe'
          if (-not (Test-Path $binary)) {
            throw "Release binary was not produced: $binary"
          }

          $releaseExe = "JPEG-Viewer-Windows-$arch.exe"
          Copy-Item $binary (Join-Path $dist $releaseExe)
          Copy-Item $binary (Join-Path $portable 'jpeg_viewer.exe')
          Copy-Item 'README.md' (Join-Path $portable 'README.md')
          Copy-Item 'QUICK_START.md' (Join-Path $portable 'GETTING_STARTED.md')
          Copy-Item 'LICENSE' (Join-Path $portable 'LICENSE')
          Set-Content -Encoding utf8 (Join-Path $portable 'VERSION.txt') "JPEG Viewer $version`r`nArchitecture: $arch"

          Compress-Archive -Path (Join-Path $portable '*') `
            -DestinationPath (Join-Path $dist "JPEG-Viewer-Portable-$arch.zip") -CompressionLevel Optimal

          Get-ChildItem $dist | Format-Table Name, Length

      - name: Upload Windows ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/windows/JPEG-Viewer-Windows-${{ matrix.arch }}.exe
            dist/windows/JPEG-Viewer-Portable-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Build installers only for the Windows architectures selected by the matrix.
  package-windows-installers:
    name: Package selected Windows installers
    needs: [build-windows, select-builds]
    if: ${{ always() && needs.select-builds.result == 'success' && needs.select-builds.outputs.windows_enabled == 'true' && needs.build-windows.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Download selected Windows binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          path: installer-input

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup --exact --source winget `
            --silent --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }

      - name: Compile selected per-user installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $output = 'dist\windows-installers'
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $built = 0
          foreach ($arch in @('x64', 'ARM64')) {
            $binaryDir = Join-Path 'installer-input' "windows-$arch"
            $binary = Join-Path $binaryDir "JPEG-Viewer-Windows-$arch.exe"
            if (-not (Test-Path $binary)) {
              Write-Host "Skipping $arch installer: that Windows artifact was not selected."
              continue
            }

            $env:JPEG_VIEWER_ARCH = $arch
            $env:JPEG_VIEWER_BINARY_DIR = (Resolve-Path $binaryDir).Path
            & $iscc '/Qp' 'packaging\windows\installer.iss'
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed for $arch (exit $LASTEXITCODE)" }
            $built++
          }

          if ($built -eq 0) { throw 'No selected Windows binary was available to package.' }
          Get-ChildItem $output | Format-Table Name, Length

      - name: Upload selected Windows installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers
          path: dist/windows-installers/JPEG-Viewer-Setup-*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Linux portable archives, built natively against the Ubuntu 22.04 baseline.
  # ---------------------------------------------------------------------------
  build-linux-portable:
    name: Build Linux portable ${{ matrix.arch }}
    if: ${{ always() && needs.select-builds.result == 'success' && needs.select-builds.outputs.linux_portable_enabled == 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    needs: [validate, select-builds]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.linux_portable_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libdbus-1-dev libx11-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.rust_target }}"

      - name: Package portable archive
        shell: bash
        run: |
          set -euo pipefail
          ARCH='${{ matrix.arch }}'
          STAGE='stage/JPEG-Viewer'
          mkdir -p "$STAGE"
          install -Dm755 "target/${{ matrix.rust_target }}/release/jpeg_viewer" "$STAGE/jpeg_viewer"
          install -Dm644 README.md "$STAGE/README.md"
          install -Dm644 QUICK_START.md "$STAGE/GETTING_STARTED.md"
          install -Dm644 LICENSE "$STAGE/LICENSE"
          install -Dm644 assets/icons/icon.png "$STAGE/icon.png"
          install -Dm644 packaging/linux/com.jpegviewer.JpegViewer.desktop "$STAGE/com.jpegviewer.JpegViewer.desktop"
          install -Dm755 packaging/linux/install-portable.sh "$STAGE/install.sh"
          install -Dm755 packaging/linux/uninstall-portable.sh "$STAGE/uninstall.sh"
          install -Dm644 packaging/linux/jpeg-viewer-queue.xml "$STAGE/jpeg-viewer-queue.xml"
          printf 'JPEG Viewer %s\nArchitecture: %s\n' "$JPEG_VIEWER_VERSION" "$ARCH" > "$STAGE/VERSION.txt"
          tar -C stage -czf "JPEG-Viewer-Linux-${ARCH}.tar.gz" JPEG-Viewer

      - name: Upload Linux portable archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-portable-${{ matrix.arch }}
          path: JPEG-Viewer-Linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Debian packages.
  # ---------------------------------------------------------------------------
  build-debian:
    name: Build Debian ${{ matrix.arch }}
    if: ${{ always() && needs.select-builds.result == 'success' && needs.select-builds.outputs.debian_enabled == 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    needs: [validate, select-builds]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.debian_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config dpkg dpkg-dev libdbus-1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Each runner is native to its target architecture. Keep Cargo's default
      # target directory so cargo-deb assets at target/release resolve correctly.
      - name: Build
        run: cargo build --release --locked

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.8.0 --locked

      - name: Build and verify Debian package
        shell: bash
        run: |
          set -euo pipefail
          cargo deb --no-build --deb-version "$JPEG_VIEWER_DEB_VERSION"
          DEB="$(find target/debian -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB" || { echo 'cargo-deb did not produce a .deb'; exit 1; }
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | grep -E 'usr/bin/jpeg_viewer|usr/share/applications|usr/share/metainfo|usr/share/mime'
          dpkg-deb -f "$DEB" Version
          cp "$DEB" "JPEG-Viewer-Linux-${{ matrix.arch }}.deb"

      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-${{ matrix.arch }}
          path: JPEG-Viewer-Linux-${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 5. macOS app bundles, ZIPs, and drag-to-Applications DMGs.
  # Signing/notarization require Apple Developer ID secrets and are not enabled.
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    if: ${{ always() && needs.select-builds.result == 'success' && needs.select-builds.outputs.macos_enabled == 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    needs: [validate, select-builds]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.macos_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.rust_target }}"

      - name: Package app bundle, ZIP, and DMG
        shell: bash
        run: |
          set -euo pipefail
          APP='JPEG Viewer.app'
          BIN="target/${{ matrix.rust_target }}/release/jpeg_viewer"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" icon.iconset
          install -m755 "$BIN" "$APP/Contents/MacOS/jpeg_viewer"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          cp LICENSE README.md QUICK_START.md "$APP/Contents/Resources/"

          # Apple iconset filenames require both standard and @2x pixel sizes.
          sips -z 16 16 assets/icons/icon.png --out icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 assets/icons/icon.png --out icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 assets/icons/icon.png --out icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 assets/icons/icon.png --out icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 assets/icons/icon.png --out icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 assets/icons/icon.png --out icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 assets/icons/icon.png --out icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 assets/icons/icon.png --out icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 assets/icons/icon.png --out icon.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 assets/icons/icon.png --out icon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/jpeg_viewer.icns"

          ARCH='${{ matrix.arch }}'
          ditto -c -k --sequesterRsrc --keepParent "$APP" "JPEG-Viewer-macOS-${ARCH}.zip"
          mkdir -p dmg-root
          ditto "$APP" "dmg-root/$APP"
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname 'JPEG Viewer' -srcfolder dmg-root -ov -format UDZO "JPEG-Viewer-macOS-${ARCH}.dmg"

      - name: Upload macOS packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: |
            JPEG-Viewer-macOS-${{ matrix.arch }}.zip
            JPEG-Viewer-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 6. AppImage. Use a tagged linuxdeploy release, never the mutable continuous build.
  # ---------------------------------------------------------------------------
  build-appimage:
    name: Build AppImage ${{ matrix.arch }}
    if: ${{ always() && needs.select-builds.result == 'success' && needs.select-builds.outputs.appimage_enabled == 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    needs: [validate, select-builds]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.appimage_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libdbus-1-dev libx11-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
            wget file libfuse2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.rust_target }}"

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/512x512/apps \
            AppDir/usr/share/mime/packages
          install -m755 "target/${{ matrix.rust_target }}/release/jpeg_viewer" AppDir/usr/bin/jpeg_viewer
          install -m644 packaging/linux/com.jpegviewer.JpegViewer.desktop AppDir/usr/share/applications/com.jpegviewer.JpegViewer.desktop
          install -m644 packaging/icons/512x512/com.jpegviewer.JpegViewer.png AppDir/usr/share/icons/hicolor/512x512/apps/com.jpegviewer.JpegViewer.png
          install -m644 packaging/linux/jpeg-viewer-queue.xml AppDir/usr/share/mime/packages/jpeg-viewer-queue.xml
          install -m644 LICENSE AppDir/LICENSE
          cp packaging/linux/com.jpegviewer.JpegViewer.desktop AppDir/com.jpegviewer.JpegViewer.desktop
          cp packaging/icons/512x512/com.jpegviewer.JpegViewer.png AppDir/jpeg_viewer.png
          cat > AppDir/AppRun <<'APP_RUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/jpeg_viewer" "$@"
          APP_RUN
          chmod +x AppDir/AppRun

          LINUXDEPLOY_VERSION='1-alpha-20251107-1'
          curl -fL --retry 3 \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-${{ matrix.appimage_arch }}.AppImage" \
            -o linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH='${{ matrix.appimage_arch }}' \
            ./linuxdeploy.AppImage --appdir AppDir \
              --desktop-file AppDir/com.jpegviewer.JpegViewer.desktop \
              --icon-file AppDir/jpeg_viewer.png --output appimage

          APPIMAGE_FILE="$(find . -maxdepth 1 -type f -iname '*.appimage' ! -name 'linuxdeploy.AppImage' -print -quit)"
          test -n "$APPIMAGE_FILE" || { echo 'linuxdeploy produced no AppImage'; exit 1; }
          mv "$APPIMAGE_FILE" "JPEG-Viewer-Linux-${{ matrix.arch }}.AppImage"
          file "JPEG-Viewer-Linux-${{ matrix.arch }}.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ matrix.arch }}
          path: JPEG-Viewer-Linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 7. Fedora-compatible RPMs built with FPM; the unused generated spec is gone.
  # ---------------------------------------------------------------------------
  build-rpm:
    name: Build Fedora RPM ${{ matrix.arch }}
    if: ${{ always() && needs.select-builds.result == 'success' && needs.select-builds.outputs.rpm_enabled == 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    needs: [validate, select-builds]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.rpm_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install RPM build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config rpm ruby ruby-dev libdbus-1-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.rust_target }}"

      - name: Install pinned FPM
        run: sudo gem install fpm --version 1.18.0 --no-document

      - name: Stage and build RPM
        shell: bash
        run: |
          set -euo pipefail
          STAGE='rpm-stage'
          install -Dm755 "target/${{ matrix.rust_target }}/release/jpeg_viewer" "$STAGE/usr/bin/jpeg_viewer"
          install -Dm644 packaging/linux/com.jpegviewer.JpegViewer.desktop "$STAGE/usr/share/applications/com.jpegviewer.JpegViewer.desktop"
          install -Dm644 packaging/linux/com.jpegviewer.JpegViewer.metainfo.xml "$STAGE/usr/share/metainfo/com.jpegviewer.JpegViewer.metainfo.xml"
          install -Dm644 packaging/icons/512x512/com.jpegviewer.JpegViewer.png "$STAGE/usr/share/icons/hicolor/512x512/apps/com.jpegviewer.JpegViewer.png"
          install -Dm644 packaging/linux/jpeg-viewer-queue.xml "$STAGE/usr/share/mime/packages/jpeg-viewer-queue.xml"
          install -Dm644 LICENSE "$STAGE/usr/share/licenses/jpeg-viewer/LICENSE"

          fpm -s dir -t rpm -n jpeg-viewer \
            --version "$JPEG_VIEWER_RPM_VERSION" \
            --architecture '${{ matrix.rpm_arch }}' \
            --license 'GPL-3.0-only' \
            --vendor 'MobinWeekend' \
            --maintainer 'MobinWeekend' \
            --url 'https://github.com/MobinWeekend/Jpeg-Viewer' \
            --description 'Fast, lightweight GPU-accelerated image viewer' \
            --depends glibc --depends libgcc --depends libstdc++ \
            --depends libX11 --depends libxkbcommon --depends wayland-libs-client \
            --depends mesa-libEGL --depends mesa-libGL --depends dbus-libs --depends libzstd \
            --after-install packaging/fedora/post-install.sh \
            --after-remove packaging/fedora/post-remove.sh \
            -C "$STAGE" .

          RPM_FILE="$(find . -maxdepth 1 -type f -name 'jpeg-viewer-*.rpm' -print -quit)"
          test -n "$RPM_FILE" || { echo 'FPM did not produce an RPM'; exit 1; }
          rpm -qp --info "$RPM_FILE"
          rpm -qp --requires "$RPM_FILE"
          rpm -qp --list "$RPM_FILE" | grep -E '/usr/bin/jpeg_viewer|\.desktop$|metainfo|mime/packages|LICENSE'
          cp "$RPM_FILE" "JPEG-Viewer-Fedora-${{ matrix.arch }}.rpm"

      - name: Upload Fedora RPM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-${{ matrix.arch }}
          path: JPEG-Viewer-Fedora-${{ matrix.arch }}.rpm
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 8. Arch packages. Normalize package extension to .pkg.tar.zst on both arches.
  # ---------------------------------------------------------------------------
  build-arch:
    name: Build Arch Linux ${{ matrix.arch }}
    if: ${{ always() && needs.select-builds.result == 'success' && needs.select-builds.outputs.arch_enabled == 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    needs: [validate, select-builds]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.arch_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Build package inside selected native Arch container
        shell: bash
        env:
          ARCH_IMAGE: ${{ matrix.arch == 'x64' && (inputs.arch_x64_image || 'archlinux/archlinux:base-devel-20261120.0.628918') || (inputs.arch_arm64_image || 'menci/archlinuxarm:base-devel-20261120.44687052260') }}
        run: |
          set -Eeuo pipefail
          ARCH_VERSION="${JPEG_VIEWER_ARCH_VERSION:?prepare-release did not set JPEG_VIEWER_ARCH_VERSION}"
          IMAGE="${ARCH_IMAGE:?No Arch image reference was supplied}"
          WORKSPACE="$(realpath "$GITHUB_WORKSPACE")"
          OUT_DIR="$WORKSPACE/out"

          # Use one writable workspace mount. Do not nest a second mount below
          # a read-only mount: the package must be visible on the runner after
          # the container exits.
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          chmod 0777 "$OUT_DIR"

          case "${{ matrix.arch }}" in
            x64) DOCKER_PLATFORM='linux/amd64' ;;
            ARM64) DOCKER_PLATFORM='linux/arm64' ;;
            *) echo "Unsupported Arch build architecture: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac

          echo "Arch image: $IMAGE"
          echo "Docker platform: $DOCKER_PLATFORM"
          echo "Expected Arch package version: $ARCH_VERSION"
          echo "Runner workspace: $WORKSPACE"

          # The build script is supplied through a heredoc on Docker STDIN.
          # --interactive is required: without it, bash -s receives EOF, exits
          # successfully without executing the build, and leaves out/ empty.
          echo "Pulling and starting selected Arch image for $DOCKER_PLATFORM..."
          SCRIPT_MARKER="$WORKSPACE/.arch-container-started-${{ matrix.arch }}"
          rm -f "$SCRIPT_MARKER"
          docker run --rm --interactive --pull=always --platform "$DOCKER_PLATFORM" --user 0:0 \
            --mount "type=bind,source=$WORKSPACE,target=/workspace" \
            -e ARCH_VERSION="$ARCH_VERSION" \
            -e JPEG_VIEWER_SOURCE_COMMIT="$GITHUB_SHA" \
            -e BUILD_ARCH='${{ matrix.arch }}' \
            -e ARCH_SCRIPT_MARKER="/workspace/.arch-container-started-${{ matrix.arch }}" \
            -w /workspace "$IMAGE" bash -s <<'ARCH_SCRIPT'
          set -Eeuo pipefail
          : "${ARCH_SCRIPT_MARKER:?Arch script marker path was not supplied}"
          printf 'Arch build script started at %s\n' "$(date -Is)" > "$ARCH_SCRIPT_MARKER"
          echo '=== Arch build script started (stdin received) ==='
          on_error() {
            status=$?
            trap - ERR
            echo "::error::Arch container failed (line ${BASH_LINENO[0]}, exit ${status})" >&2
            exit "$status"
          }
          trap on_error ERR

          echo '=== Arch container ==='
          cat /etc/os-release
          ACTUAL_MACHINE="$(uname -m)"
          printf 'Architecture: %s\n' "$ACTUAL_MACHINE"
          if [[ "$BUILD_ARCH" == 'x64' && "$ACTUAL_MACHINE" != 'x86_64' ]]; then
            echo "Selected x64 image has unexpected architecture: $ACTUAL_MACHINE" >&2
            exit 1
          fi
          if [[ "$BUILD_ARCH" == 'ARM64' && "$ACTUAL_MACHINE" != 'aarch64' ]]; then
            echo "Selected ARM64 image has unexpected architecture: $ACTUAL_MACHINE" >&2
            exit 1
          fi
          printf 'Image packages: '; pacman -Q base-devel pacman 2>/dev/null || true

          if [[ "$BUILD_ARCH" == "ARM64" ]]; then
            pacman-key --init
            pacman-key --populate archlinuxarm
          fi

          # The pinned images already contain base-devel. Install the packages
          # required by this PKGBUILD and its native desktop dependencies.
          pacman -Syu --noconfirm --needed \
            base-devel rust cargo pkgconf dbus libx11 libxkbcommon \
            wayland mesa git zstd unrar python

          for tool in makepkg runuser git cargo rustc; do
            command -v "$tool" >/dev/null || {
              echo "Required Arch build tool is missing: $tool" >&2
              exit 1
            }
          done
          getent passwd nobody >/dev/null || {
            echo 'The Arch image has no nobody account' >&2
            exit 1
          }

          ARCH_ROOT=/var/cache/jpeg-viewer-arch
          BUILD_DIR="$ARCH_ROOT/build"
          HOME_DIR="$ARCH_ROOT/home"
          PKG_DIR="$ARCH_ROOT/packages"
          rm -rf "$ARCH_ROOT"
          install -d -o nobody -g nobody -m 0755 \
            "$BUILD_DIR" "$HOME_DIR" "$PKG_DIR"
          install -m 0644 /workspace/packaging/arch/PKGBUILD "$BUILD_DIR/PKGBUILD"
          chown -R nobody:nobody "$ARCH_ROOT"
          cd "$BUILD_DIR"

          echo '=== PKGBUILD package list ==='
          runuser -u nobody -- env \
            HOME="$HOME_DIR" USER=nobody LOGNAME=nobody \
            JPEG_VIEWER_SOURCE_COMMIT="$JPEG_VIEWER_SOURCE_COMMIT" \
            PKGDEST="$PKG_DIR" PKGEXT='.pkg.tar.zst' \
            makepkg --packagelist

          echo '=== Building package ==='
          runuser -u nobody -- env \
            -u CC -u CXX -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS \
            -u CARGO_BUILD_RUSTFLAGS \
            -u CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER \
            -u CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER \
            -u CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS \
            -u CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS \
            HOME="$HOME_DIR" USER=nobody LOGNAME=nobody \
            JPEG_VIEWER_SOURCE_COMMIT="$JPEG_VIEWER_SOURCE_COMMIT" \
            PKGDEST="$PKG_DIR" PKGEXT='.pkg.tar.zst' \
            makepkg --noconfirm --cleanbuild --log

          echo '=== Package output directory ==='
          find "$PKG_DIR" -maxdepth 1 -type f -printf '%M %u:%g %p (%s bytes)\n'
          mapfile -t BUILT_PACKAGES < <(
            find "$PKG_DIR" -maxdepth 1 -type f \
              -name 'jpeg-viewer-*.pkg.tar.zst' -print | sort
          )
          if [[ "${#BUILT_PACKAGES[@]}" -ne 1 ]]; then
            echo "Expected exactly one package in PKGDEST, found ${#BUILT_PACKAGES[@]}" >&2
            echo 'makepkg expected package path:' >&2
            runuser -u nobody -- env \
              HOME="$HOME_DIR" USER=nobody LOGNAME=nobody \
              JPEG_VIEWER_SOURCE_COMMIT="$JPEG_VIEWER_SOURCE_COMMIT" \
              PKGDEST="$PKG_DIR" PKGEXT='.pkg.tar.zst' \
              makepkg --packagelist >&2 || true
            find "$ARCH_ROOT" -maxdepth 4 -printf '%M %u:%g %p (%s bytes)\n' >&2
            exit 1
          fi

          PACKAGE_FILE="${BUILT_PACKAGES[0]}"
          PACKAGE_NAME="$(basename "$PACKAGE_FILE")"
          case "$PACKAGE_NAME" in
            "jpeg-viewer-${ARCH_VERSION}-"*.pkg.tar.zst) ;;
            *)
              echo "Package version mismatch: expected ${ARCH_VERSION}, got ${PACKAGE_NAME}" >&2
              exit 1
              ;;
          esac
          test -s "$PACKAGE_FILE"

          # The workspace is the only bind mount, so this file is immediately
          # visible to the GitHub runner without docker cp or a nested mount.
          install -d -m 0777 /workspace/out
          install -m 0644 "$PACKAGE_FILE" "/workspace/out/$PACKAGE_NAME"
          echo "Package exported: /workspace/out/$PACKAGE_NAME"
          sha256sum "/workspace/out/$PACKAGE_NAME"
          ARCH_SCRIPT

          if [[ ! -s "$SCRIPT_MARKER" ]]; then
            echo 'Arch container exited without executing the supplied build script.' >&2
            echo 'Check that docker run uses --interactive when passing bash -s via heredoc.' >&2
            exit 1
          fi
          rm -f "$SCRIPT_MARKER"

          echo '=== Runner-side package discovery ==='
          find "$OUT_DIR" -maxdepth 1 -type f -printf '%M %U:%G %p (%s bytes)\n'
          mapfile -t PACKAGES < <(
            find "$OUT_DIR" -maxdepth 1 -type f \
              -name 'jpeg-viewer-*.pkg.tar.zst' -print | sort
          )
          if [[ "${#PACKAGES[@]}" -ne 1 ]]; then
            echo "Expected exactly one Arch package in runner output, found ${#PACKAGES[@]}" >&2
            find "$OUT_DIR" -maxdepth 2 -printf '%M %U:%G %p (%s bytes)\n' >&2
            exit 1
          fi

          PACKAGE_FILE="${PACKAGES[0]}"
          PACKAGE_NAME="$(basename "$PACKAGE_FILE")"
          case "$PACKAGE_NAME" in
            "jpeg-viewer-${ARCH_VERSION}-"*.pkg.tar.zst) ;;
            *)
              echo "Runner package version mismatch: expected ${ARCH_VERSION}, got ${PACKAGE_NAME}" >&2
              exit 1
              ;;
          esac

          test -s "$PACKAGE_FILE"
          cp "$PACKAGE_FILE" "JPEG-Viewer-Arch-${{ matrix.arch }}.pkg.tar.zst"
          tar --zstd -tf "JPEG-Viewer-Arch-${{ matrix.arch }}.pkg.tar.zst" | \
            grep -E 'usr/bin/jpeg_viewer|\.desktop$|metainfo|mime/packages|LICENSE'

      - name: Upload Arch package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-${{ matrix.arch }}
          path: JPEG-Viewer-Arch-${{ matrix.arch }}.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # 9. Flatpak. Cargo sources are generated from the committed, version-synced lock.
  # ---------------------------------------------------------------------------
  build-flatpak:
    name: Build Flatpak ${{ matrix.arch }}
    if: ${{ always() && needs.select-builds.result == 'success' && needs.select-builds.outputs.flatpak_enabled == 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    needs: [validate, select-builds]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.flatpak_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder pipx
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive -y \
            flathub org.gnome.Platform//50 org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Install pinned Flatpak Cargo source generator
        run: |
          pipx install flatpak-cargo-generator==0.1.5
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare release metadata
        uses: ./.github/actions/prepare-release

      - name: Generate offline Cargo sources
        run: flatpak-cargo-generator Cargo.lock -o packaging/flatpak/cargo-sources.json

      - name: Build Flatpak bundle
        run: |
          # The app ref's branch is stable. Flatpak Builder otherwise defaults
          # to master when no branch is specified in the manifest.
          flatpak-builder --force-clean --default-branch=stable \
            --install-deps-from=flathub --repo=repo \
            build-dir packaging/flatpak/com.jpegviewer.JpegViewer.yml

          FLATPAK_ARCH="$(uname -m)"
          echo "Bundling com.jpegviewer.JpegViewer (branch=stable, arch=$FLATPAK_ARCH)"
          if ! flatpak build-bundle --arch="$FLATPAK_ARCH" \
            repo "JPEG-Viewer-Linux-${{ matrix.arch }}.flatpak" \
            com.jpegviewer.JpegViewer stable; then
            echo "Available refs in repository:"
            ostree --repo=repo refs || true
            find repo -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Upload Flatpak
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-${{ matrix.arch }}
          path: JPEG-Viewer-Linux-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 10. Verify all artifacts, generate checksums/notes, and publish the release.
  # ---------------------------------------------------------------------------
  release:
    name: Verify and publish GitHub Release
    if: ${{ github.event_name == 'push' || inputs.mode == 'full-release' }}
    needs:
      - validate
      - build-windows
      - package-windows-installers
      - build-linux-portable
      - build-debian
      - build-macos
      - build-appimage
      - build-rpm
      - build-arch
      - build-flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout full history for generated release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare versioned source metadata
        uses: ./.github/actions/prepare-release

      - name: Ensure manual release tag is unused
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${JPEG_VIEWER_RELEASE_TAG:?Manual release version is required}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Git tag ${RELEASE_TAG} already exists. Choose a new version or use artifacts-only mode."
            exit 1
          fi
          echo "Release tag ${RELEASE_TAG} is available."

      - name: Generate source dependency SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: JPEG-Viewer-SBOM.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: incoming

      - name: Flatten, validate, and checksum release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [[ -e "release-files/$name" ]]; then
              echo "Duplicate release asset filename: $name" >&2
              exit 1
            fi
            cp "$file" "release-files/$name"
          done < <(find incoming -type f -print0)
          install -m644 JPEG-Viewer-SBOM.spdx.json release-files/JPEG-Viewer-SBOM.spdx.json
          RELEASE_TAG="${JPEG_VIEWER_RELEASE_TAG:-$GITHUB_REF_NAME}"
          {
            echo "Tag: $RELEASE_TAG"
            echo "Commit: $GITHUB_SHA"
            echo "Built by: GitHub Actions"
            echo "Windows installers are per-user and do not require administrator privileges."
            echo "Windows binaries are currently unsigned; SmartScreen reputation may be limited."
            echo "macOS bundles are currently unsigned and not notarized."
          } > release-files/BUILD-INFO.txt

          expected=(
            'JPEG-Viewer-Windows-x64.exe'
            'JPEG-Viewer-Windows-ARM64.exe'
            'JPEG-Viewer-Portable-x64.zip'
            'JPEG-Viewer-Portable-ARM64.zip'
            'JPEG-Viewer-Setup-x64.exe'
            'JPEG-Viewer-Setup-ARM64.exe'
            'JPEG-Viewer-Linux-x64.tar.gz'
            'JPEG-Viewer-Linux-ARM64.tar.gz'
            'JPEG-Viewer-Linux-x64.deb'
            'JPEG-Viewer-Linux-ARM64.deb'
            'JPEG-Viewer-macOS-Intel-x64.zip'
            'JPEG-Viewer-macOS-Intel-x64.dmg'
            'JPEG-Viewer-macOS-Apple-Silicon-ARM64.zip'
            'JPEG-Viewer-macOS-Apple-Silicon-ARM64.dmg'
            'JPEG-Viewer-Linux-x64.AppImage'
            'JPEG-Viewer-Linux-ARM64.AppImage'
            'JPEG-Viewer-Fedora-x64.rpm'
            'JPEG-Viewer-Fedora-ARM64.rpm'
            'JPEG-Viewer-Arch-x64.pkg.tar.zst'
            'JPEG-Viewer-Arch-ARM64.pkg.tar.zst'
            'JPEG-Viewer-Linux-x64.flatpak'
            'JPEG-Viewer-Linux-ARM64.flatpak'
            'JPEG-Viewer-SBOM.spdx.json'
            'BUILD-INFO.txt'
          )

          for asset in "${expected[@]}"; do
            if [[ ! -s "release-files/$asset" ]]; then
              echo "Required release asset is missing or empty: $asset" >&2
              exit 1
            fi
          done

          actual_count="$(find release-files -maxdepth 1 -type f | wc -l)"
          if [[ "$actual_count" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} assets but found $actual_count before checksums." >&2
            find release-files -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          (cd release-files && sha256sum "${expected[@]}" > SHA256SUMS)

          echo 'Release assets verified:'
          ls -lh release-files

      - name: Generate categorized release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${JPEG_VIEWER_RELEASE_TAG:-$GITHUB_REF_NAME}"
          GENERATED_NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --method POST \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq '.body')"

          cat > release-notes.md <<EOF
          # JPEG Viewer ${RELEASE_TAG}

          GPU-accelerated desktop image viewer for Windows, Linux, and macOS.

          ## Downloads

          | Platform | Package | Download |
          |---|---|---|
          | Windows x64 | Per-user installer | [Setup](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Setup-x64.exe) |
          | Windows ARM64 | Per-user installer | [Setup](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Setup-ARM64.exe) |
          | Windows x64 | Portable | [ZIP](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Portable-x64.zip) |
          | Windows ARM64 | Portable | [ZIP](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Portable-ARM64.zip) |
          | macOS Intel | Disk image | [DMG](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-macOS-Intel-x64.dmg) |
          | macOS Intel | ZIP | [ZIP](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-macOS-Intel-x64.zip) |
          | macOS Apple Silicon | Disk image | [DMG](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-macOS-Apple-Silicon-ARM64.dmg) |
          | macOS Apple Silicon | ZIP | [ZIP](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-macOS-Apple-Silicon-ARM64.zip) |
          | Linux x64 | Portable | [TAR.GZ](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Linux-x64.tar.gz) |
          | Linux ARM64 | Portable | [TAR.GZ](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Linux-ARM64.tar.gz) |
          | Debian / Ubuntu x64 | Native package | [DEB](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Linux-x64.deb) |
          | Debian / Ubuntu ARM64 | Native package | [DEB](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Linux-ARM64.deb) |
          | Fedora x64 | Native package | [RPM](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Fedora-x64.rpm) |
          | Fedora ARM64 | Native package | [RPM](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Fedora-ARM64.rpm) |
          | Arch x64 | Native package | [PKG.TAR.ZST](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Arch-x64.pkg.tar.zst) |
          | Arch ARM64 | Native package | [PKG.TAR.ZST](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Arch-ARM64.pkg.tar.zst) |
          | Linux x64 | Flatpak bundle | [FLATPAK](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Linux-x64.flatpak) |
          | Linux ARM64 | Flatpak bundle | [FLATPAK](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Linux-ARM64.flatpak) |
          | Linux x64 | AppImage | [APPIMAGE](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Linux-x64.AppImage) |
          | Linux ARM64 | AppImage | [APPIMAGE](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-Linux-ARM64.AppImage) |

          **Checksums:** [SHA256SUMS](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/SHA256SUMS)

          **Software bill of materials:** [SPDX JSON](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/JPEG-Viewer-SBOM.spdx.json)

          Release assets also receive GitHub build-provenance attestations. Verify them with GitHub CLI using `gh attestation verify`.

          **Windows:** The Setup installers install for the current user only and do not require administrator privileges. Portable ZIPs do not install anything. Windows binaries are currently unsigned, so SmartScreen may show a reputation warning.

          **macOS:** These packages are currently unsigned and not notarized. Gatekeeper may require users to approve the application manually.

          ## What's Changed

          EOF
          printf '%s\n' "$GENERATED_NOTES" >> release-notes.md

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'release-files/*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.JPEG_VIEWER_RELEASE_TAG || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: JPEG Viewer ${{ env.JPEG_VIEWER_RELEASE_TAG || github.ref_name }}
          body_path: release-notes.md
          files: release-files/*
          fail_on_unmatched_files: true
          prerelease: ${{ env.JPEG_VIEWER_IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.JPEG_VIEWER_IS_PRERELEASE != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

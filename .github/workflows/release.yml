        with:
          name: JPEG-View-Linux-ARM64-deb
          path: JPEG-View-Linux-ARM64.deb


  # ============================================================
  # Flatpak x86_64
  # ============================================================

  build-flatpak-x86_64:
    name: Build Flatpak x86_64
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Flatpak Cargo sources
        shell: bash
        run: |
          test -f packaging/flatpak/cargo-sources.json || {
            echo "Missing packaging/flatpak/cargo-sources.json"
            exit 1
          }

      - name: Set AppStream release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DATE=$(date -u +%Y-%m-%d)

          python3 - "$VERSION" "$DATE" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          release_date = sys.argv[2]

          path = pathlib.Path(
              "packaging/flatpak/com.jpegviewer.JpegViewer.metainfo.xml"
          )

          text = path.read_text()

          pattern = (
              r'<release\s+version="[^"]+"\s+date="[^"]+">'
          )

          replacement = (
              f'<release version="{version}" date="{release_date}">'
          )

          text, count = re.subn(
              pattern,
              replacement,
              text,
              count=1,
          )

          if count == 0:
              raise SystemExit(
                  "Could not find an existing AppStream release entry."
              )

          path.write_text(text)
          PY

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.jpegviewer.JpegViewer.yml
          bundle: JPEG-View-Linux-x86_64.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          arch: x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JPEG-View-Linux-x86_64-Flatpak
          path: JPEG-View-Linux-x86_64.flatpak



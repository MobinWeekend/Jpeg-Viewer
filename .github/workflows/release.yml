name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Windows (x64)
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: bash
        run: |
          cargo install cargo-edit
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          echo "Setting version to: $VERSION"
          cargo set-version $VERSION

      - name: Build release
        run: cargo build --release

      - name: Rename binary
        run: |
          copy target\release\jpeg_viewer.exe JPEG-View-Windows-x64.exe

      - name: Upload Windows x64 executable
        uses: actions/upload-artifact@v4
        with:
          name: JPEG-View-Windows-x64.exe
          path: JPEG-View-Windows-x64.exe

  build-windows-arm:
    name: Build Windows (ARM64)
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: bash
        run: |
          cargo install cargo-edit
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          echo "Setting version to: $VERSION"
          cargo set-version $VERSION

      - name: Build for ARM64
        run: |
          cargo build --release --target aarch64-pc-windows-msvc

      - name: Rename binary
        run: |
          copy target\aarch64-pc-windows-msvc\release\jpeg_viewer.exe JPEG-View-Windows-ARM64.exe

      - name: Upload Windows ARM64 executable
        uses: actions/upload-artifact@v4
        with:
          name: JPEG-View-Windows-ARM64.exe
          path: JPEG-View-Windows-ARM64.exe

  build-macos:
    name: Build macOS Portable (Apple Silicon)
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: bash
        run: |
          cargo install cargo-edit
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          echo "Setting version to: $VERSION"
          cargo set-version $VERSION

      - name: Build for Apple Silicon
        run: |
          cargo build --release --target aarch64-apple-darwin
          
          # Make it a standalone executable
          cp target/aarch64-apple-darwin/release/jpeg_viewer JPEG-View-macOS
          chmod +x JPEG-View-macOS

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: JPEG-View-macOS
          path: JPEG-View-macOS

  release:
    name: Create GitHub Release
    needs: [build-windows-x64, build-windows-arm, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s")
          else
            LOG=$(git log $LAST_TAG..HEAD --pretty=format:"- %s")
          fi
          {
            echo "body<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: List downloaded files
        run: ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes
            ${{ steps.changelog.outputs.body }}
            
            ## Downloads
            
            ### Windows
            - **x64**: `JPEG-View-Windows-x64.exe` - For most Windows PCs
            - **ARM64**: `JPEG-View-Windows-ARM64.exe` - For Windows on ARM (Surface Pro X, etc.)
            
            ### macOS
            - **Apple Silicon**: `JPEG-View-macOS` - For M1-M5 Macs (may need to right-click → Open first time)
            
            **Version**: ${{ github.ref_name }}
          files: |
            release/**/*

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libgtk-3-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set version from Git tag
        shell: bash
        run: |
          cargo install cargo-edit
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          echo "Setting version to: $VERSION"
          cargo set-version $VERSION

      - name: Build release
        run: cargo build --release

      - name: Rename binary
        run: |
          cp target/release/jpeg_viewer JPEG-View-Linux
          chmod +x JPEG-View-Linux

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: JPEG-View-Linux
          path: JPEG-View-Linux
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot[bot]
  categories:
    - title: New Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Performance
      labels:
        - performance
    - title: Maintenance
      labels:
        - maintenance
        - refactor
        - dependencies
    - title: Other Changes
      labels:
        - "*"

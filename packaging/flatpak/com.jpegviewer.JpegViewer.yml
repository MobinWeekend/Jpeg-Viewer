app-id: com.jpegviewer.JpegViewer

runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: jpeg_viewer

finish-args:
  - --device=dri
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --filesystem=home

modules:
  - name: jpeg-viewer
    buildsystem: cargo

    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_NET_OFFLINE: "true"

    build-commands:
      - install -Dm755 \
          target/release/jpeg_viewer \
          /app/bin/jpeg_viewer

      - install -Dm644 \
          packaging/linux/com.jpegviewer.JpegViewer.desktop \
          /app/share/applications/com.jpegviewer.JpegViewer.desktop

      - install -Dm644 \
          assets/icons/icon.png \
          /app/share/icons/hicolor/512x512/apps/com.jpegviewer.JpegViewer.png

      - install -Dm644 \
          packaging/flatpak/com.jpegviewer.JpegViewer.metainfo.xml \
          /app/share/metainfo/com.jpegviewer.JpegViewer.metainfo.xml

    sources:
      - cargo-sources.json

      - type: dir
        path: ../..

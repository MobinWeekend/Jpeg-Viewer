app-id: com.jpegviewer.JpegViewer

runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: jpeg_viewer

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --share=ipc
  - --share=network
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: jpeg-viewer

    buildsystem: simple

    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/jpeg-viewer/cargo
        CARGO_NET_OFFLINE: "true"
        # Use the Rust toolchain supplied by the pinned Flatpak SDK extension.
        # This intentionally overrides the repository rust-toolchain.toml inside the sandbox.
        RUSTUP_TOOLCHAIN: stable

    build-commands:
      - cargo build --offline --release --locked
      - install -Dm755 target/release/jpeg_viewer /app/bin/jpeg_viewer

      - install -Dm644 packaging/icons/512x512/com.jpegviewer.JpegViewer.png /app/share/icons/hicolor/512x512/apps/com.jpegviewer.JpegViewer.png

      - install -Dm644 packaging/flatpak/com.jpegviewer.JpegViewer.metainfo.xml /app/share/metainfo/com.jpegviewer.JpegViewer.metainfo.xml

      - install -Dm644 packaging/flatpak/com.jpegviewer.JpegViewer.desktop /app/share/applications/com.jpegviewer.JpegViewer.desktop

      - install -Dm644 packaging/linux/jpeg-viewer-queue.xml /app/share/mime/packages/jpeg-viewer-queue.xml

      - install -Dm644 LICENSE /app/share/licenses/com.jpegviewer.JpegViewer/LICENSE

    sources:
      - cargo-sources.json
      - type: dir
        path: ../..

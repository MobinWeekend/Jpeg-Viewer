app-id: com.jpegviewer.JpegViewer
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: jpeg_viewer

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11

  # GPU acceleration
  - --device=dri

  # Filesystem access
  - --filesystem=home

  # Desktop integration
  - --share=ipc

  # Audio, if needed by the application
  - --socket=pulseaudio

modules:
  - name: jpeg-viewer
    buildsystem: simple

    build-options:
      env:
        CARGO_HOME: /run/build/jpeg-viewer/cargo

    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/jpeg_viewer /app/bin/jpeg_viewer

      # Application icon
      - install -Dm644 assets/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.jpegviewer.JpegViewer.png

      # AppStream metadata
      - install -Dm644 packaging/flatpak/com.jpegviewer.JpegViewer.metainfo.xml /app/share/metainfo/com.jpegviewer.JpegViewer.metainfo.xml

      # Desktop entry
      - install -Dm644 packaging/flatpak/com.jpegviewer.JpegViewer.desktop /app/share/applications/com.jpegviewer.JpegViewer.desktop

    sources:
      - cargo-sources.json
      - type: dir
        path: ../..

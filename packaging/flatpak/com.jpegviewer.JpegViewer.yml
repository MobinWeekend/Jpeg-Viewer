app-id: com.jpegviewer.JpegViewer

runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable//25.08

command: jpeg_viewer

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --share=ipc
  - --socket=pulseaudio

modules:
  - name: jpeg-viewer

    buildsystem: simple

    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/jpeg-viewer/cargo
        CARGO_NET_OFFLINE: "true"

    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release --locked
      - install -Dm755 target/release/jpeg_viewer /app/bin/jpeg_viewer

      - install -Dm644 assets/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.jpegviewer.JpegViewer.png

      - install -Dm644 packaging/flatpak/com.jpegviewer.JpegViewer.metainfo.xml /app/share/metainfo/com.jpegviewer.JpegViewer.metainfo.xml

      - install -Dm644 packaging/flatpak/com.jpegviewer.JpegViewer.desktop /app/share/applications/com.jpegviewer.JpegViewer.desktop

      - install -Dm644 LICENSE /app/share/licenses/com.jpegviewer.JpegViewer/jpeg-viewer/LICENSE

    sources:
      - cargo-sources.json

      - type: dir
        path: ../..
